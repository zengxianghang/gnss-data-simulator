name: Scan real DLR GPS modern health

on:
  push:
    branches:
      - issue-51-all-signal-residuals
    paths:
      - .github/workflows/scan-issue51-mrtklib-gps-modern.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          submodules: recursive
      - name: Pin RTKLIB and download provenance-fixed DLR day
        run: |
          set -euo pipefail
          git -C third_party/RTKLIB fetch origin issue-6-all-signal-residuals-bds-tgd
          git -C third_party/RTKLIB checkout 894417e20a8c1b7178e08bd410840eeb4f1ff779
          curl -fsSL --retry 3 --retry-delay 1 \
            'https://raw.githubusercontent.com/h-shiono/MRTKLIB/8781ebf1448251544be7c7273a06176641510c24/tests/data/rinex4/BRD400DLR_S_20260680000_01D_MN.rnx.gz' \
            -o /tmp/BRD400DLR_S_20260680000_01D_MN.rnx.gz
          gunzip -c /tmp/BRD400DLR_S_20260680000_01D_MN.rnx.gz > /tmp/BRD400DLR_S_20260680000_01D_MN.rnx
      - name: Compile pinned RTKLIB health scanner
        run: |
          cat >/tmp/scan_gps_modern.c <<'EOF'
          #include "rtklib.h"
          #include <stdio.h>
          #include <string.h>

          int main(void) {
              obs_t obs={0}; nav_t nav={0}; sta_t sta={0};
              const char *path="/tmp/BRD400DLR_S_20260680000_01D_MN.rnx";
              int cnav_total=0,cnav_zero=0,cnv2_total=0,cnv2_zero=0,printed_cnav=0,printed_cnv2=0;
              if (!readrnx(path,1,"",&obs,&nav,&sta)) {
                  fprintf(stderr,"readrnx failed\n");
                  return 2;
              }
              freeobs(&obs);
              uniqnav(&nav);
              for (int i=0;i<nav.n;i++) {
                  eph_t *e=&nav.eph[i];
                  int prn=0,sys=satsys(e->sat,&prn),week=0;
                  double toe,ttr;
                  char id[16]={0};
                  if (sys!=SYS_GPS) continue;
                  if (e->hdr.msg_type!=NAV_CNAV && e->hdr.msg_type!=NAV_CNV2) continue;
                  toe=time2gpst(e->toe,&week);
                  ttr=time2gpst(e->ttr,&week);
                  satno2id(e->sat,id);
                  if (e->hdr.msg_type==NAV_CNAV) {
                      cnav_total++;
                      if (e->svh==0) {
                          cnav_zero++;
                          if (printed_cnav++<20) printf("HEALTHY_CNAV sat=%s svh=%d toe=%.3f ttr=%.3f week=%d\n",id,e->svh,toe,ttr,week);
                      }
                  } else {
                      cnv2_total++;
                      if (e->svh==0) {
                          cnv2_zero++;
                          if (printed_cnv2++<20) printf("HEALTHY_CNV2 sat=%s svh=%d toe=%.3f ttr=%.3f week=%d\n",id,e->svh,toe,ttr,week);
                      }
                  }
              }
              printf("GPS_MODERN_HEALTH_SUMMARY cnav_total=%d cnav_svh0=%d cnv2_total=%d cnv2_svh0=%d\n",cnav_total,cnav_zero,cnv2_total,cnv2_zero);
              freenav(&nav,0xFF);
              return cnav_zero>0 && cnv2_zero>0 ? 0 : 3;
          }
          EOF
          cc -O2 -std=c99 -ffunction-sections -fdata-sections \
            -Ithird_party/RTKLIB/src -DENAGLO -DENAQZS -DENAGAL -DENACMP -DNFREQ=3 \
            /tmp/scan_gps_modern.c src/gnss/rtklib_rinex_obs_ext.c \
            third_party/RTKLIB/src/rtklib_obs_ext.c third_party/RTKLIB/src/rtkcmn.c \
            -Wl,--gc-sections -lm -lpthread -o /tmp/scan_gps_modern
      - name: Scan health-zero GPS CNAV and CNV2
        run: /tmp/scan_gps_modern
