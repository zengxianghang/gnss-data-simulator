name: tmp-issue81-bds-time-fix
on:
  push:
    branches:
      - issue-81-serialized-nav-roundtrip
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-81-serialized-nav-roundtrip
      - name: Apply fix
        run: python3 .github/issue81_bds_time_fix.py
      - name: Format changed C++
        run: clang-format -i src/gnss/rtklib_nav_input_adapter.cpp src/output/novatel_nav_writer.cpp
      - name: Remove temporary files
        run: rm .github/issue81_bds_time_fix.py .github/workflows/tmp-issue81-bds-time-fix.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore BeiDou native Toe semantics for RTKLIB NAV import"
          git push origin HEAD:issue-81-serialized-nav-roundtrip
