name: Scan real DLR GPS CNV2 candidates

on:
  push:
    branches:
      - issue-51-all-signal-residuals
    paths:
      - .github/workflows/scan-issue51-mrtklib-gps-modern.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
      - name: Scan provenance-fixed DLR daily files for GPS CNV2
        run: |
          set -euo pipefail
          found=0
          for spec in \
            2022:001 \
            2023:001 \
            2024:001 \
            2025:075 \
            2025:078 \
            2026:068 \
            2026:180
          do
            year="${spec%%:*}"
            doy="${spec##*:}"
            file="BRD400DLR_S_${year}${doy}0000_01D_MN.rnx.gz"
            url="https://igs.bkg.bund.de/root_ftp/IGS/BRDC/${year}/${doy}/${file}"
            echo "SCAN ${url}"
            if ! curl -fsSL --retry 2 --retry-delay 1 "${url}" -o "/tmp/${file}"; then
              echo "DOWNLOAD_MISSING year=${year} doy=${doy}"
              continue
            fi
            gunzip -c "/tmp/${file}" > "/tmp/${file%.gz}"
            count="$(grep -Ec '^> EPH G[0-9][0-9] CNV2' "/tmp/${file%.gz}" || true)"
            cnav="$(grep -Ec '^> EPH G[0-9][0-9] CNAV' "/tmp/${file%.gz}" || true)"
            echo "GPS_MODERN_RAW year=${year} doy=${doy} cnav=${cnav} cnv2=${count}"
            if [ "${count}" -gt 0 ]; then
              echo "GPS_CNV2_SOURCE year=${year} doy=${doy} url=${url}"
              python - "/tmp/${file%.gz}" <<'PY'
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text().splitlines()
          for i, line in enumerate(lines):
              if line.startswith('> EPH G') and line.rstrip().endswith(' CNV2'):
                  print('GPS_CNV2_BLOCK_BEGIN')
                  for row in lines[i:i+11]:
                      print(row)
                  print('GPS_CNV2_BLOCK_END')
                  break
          PY
              found=1
              break
            fi
          done
          test "${found}" -eq 1
