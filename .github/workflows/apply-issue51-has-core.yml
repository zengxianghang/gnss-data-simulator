name: Apply issue 51 HAS measurement core

on:
  push:
    branches: [issue-51-all-signal-residuals]
    paths:
      - tools/apply_issue51_has_core_patch.py
      - .github/workflows/apply-issue51-has-core.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Draft branch with dependencies
        uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          fetch-depth: 0
          submodules: recursive

      - name: Apply guarded core patch
        run: python tools/apply_issue51_has_core_patch.py

      - name: Format changed C++
        shell: bash
        run: |
          clang-format -i \
            src/gnss/satellite_engine.h \
            src/gnss/satellite_engine.cpp \
            src/model/measurement_model.h \
            src/model/measurement_model.cpp \
            tests/unit/test_measurement_model.cpp
          git diff --check

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test full suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Commit validated core and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_issue51_has_core_patch.py
          rm .github/workflows/apply-issue51-has-core.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add external-state geometry and explicit code-bias measurement core'
          git push origin HEAD:issue-51-all-signal-residuals
