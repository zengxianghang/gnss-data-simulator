name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - issue-39-runtime-cn0-model

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      - name: Apply clang-format
        shell: bash
        run: |
          mapfile -t files < <(find include src tests tools -type f \( -name '*.h' -o -name '*.c' -o -name '*.cpp' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C/C++ files found"
            exit 1
          fi
          clang-format -i "${files[@]}"
      - name: Commit formatting on temporary branch push
        if: github.event_name == 'push' && github.ref_name == 'issue-39-runtime-cn0-model'
        shell: bash
        run: |
          if git diff --quiet -- include src tests tools; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include src tests tools
          git commit -m "style: apply clang-format"
          git push origin HEAD:issue-39-runtime-cn0-model
      - name: Check clang-format
        if: github.event_name != 'push' || github.ref_name != 'issue-39-runtime-cn0-model'
        shell: bash
        run: |
          if ! git diff --exit-code -- include src tests tools; then
            echo "C/C++ formatting differs from .clang-format."
            exit 1
          fi

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout with RTKLIB
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
