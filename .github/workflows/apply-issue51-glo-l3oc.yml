name: Materialize all-signal residual fixes

on:
  push:
    branches:
      - issue-51-all-signal-residuals
    paths:
      - tools/apply_issue51_glo_l3oc_patch.py
      - tools/apply_issue51_rtklib_link_fix.py
      - tools/apply_issue51_doppler_family_policy.py
      - tools/apply_issue51_requested_family_validation.py
      - tools/apply_issue51_code_state_family.py
      - tools/apply_issue51_code_state_availability.py
      - tools/apply_issue51_solution_engine_signature.py
      - tools/apply_issue51_spp_family_nav.py
      - tools/apply_issue51_multisite_coverage.py
      - tools/apply_issue51_gps_cnav_window.py
      - tools/apply_issue51_snapshot_family.py
      - tools/apply_issue51_signal_health.py
      - tools/apply_issue51_real_gps_modern_probe.py
      - .github/workflows/apply-issue51-glo-l3oc.yml

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Draft branch with dependencies
        uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pin clean RTKLIB Draft dependency
        run: |
          set -euo pipefail
          git -C third_party/RTKLIB fetch origin issue-6-all-signal-residuals-bds-tgd
          git -C third_party/RTKLIB checkout 894417e20a8c1b7178e08bd410840eeb4f1ff779
          python - <<'PY'
          from pathlib import Path
          path = Path('CMakeLists.txt')
          text = path.read_text()
          old = 'set(GNSS_SIM_RTKLIB_COMMIT "8d252915f589e570e69db7f01f27cda276a08f02" CACHE STRING'
          new = 'set(GNSS_SIM_RTKLIB_COMMIT "894417e20a8c1b7178e08bd410840eeb4f1ff779" CACHE STRING'
          if text.count(old) != 1:
              raise RuntimeError(f'CMake RTKLIB pin anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(git -C third_party/RTKLIB rev-parse HEAD)" = "894417e20a8c1b7178e08bd410840eeb4f1ff779"

      - name: Syntax-check guarded patch drivers
        run: >-
          python -m py_compile
          tools/apply_issue51_glo_l3oc_patch.py
          tools/apply_issue51_rtklib_link_fix.py
          tools/apply_issue51_doppler_family_policy.py
          tools/apply_issue51_requested_family_validation.py
          tools/apply_issue51_code_state_family.py
          tools/apply_issue51_code_state_availability.py
          tools/apply_issue51_solution_engine_signature.py
          tools/apply_issue51_spp_family_nav.py
          tools/apply_issue51_multisite_coverage.py
          tools/apply_issue51_gps_cnav_window.py
          tools/apply_issue51_snapshot_family.py
          tools/apply_issue51_signal_health.py
          tools/apply_issue51_real_gps_modern_probe.py

      - name: Apply permanent guarded implementation
        run: |
          set -euo pipefail
          python tools/apply_issue51_glo_l3oc_patch.py
          python tools/apply_issue51_rtklib_link_fix.py
          python tools/apply_issue51_doppler_family_policy.py
          python tools/apply_issue51_code_state_family.py
          python tools/apply_issue51_code_state_availability.py
          python tools/apply_issue51_solution_engine_signature.py
          python tools/apply_issue51_spp_family_nav.py
          python tools/apply_issue51_requested_family_validation.py
          python tools/apply_issue51_multisite_coverage.py
          python tools/apply_issue51_gps_cnav_window.py
          python tools/apply_issue51_snapshot_family.py
          python tools/apply_issue51_signal_health.py

      - name: Format modified C and C++ sources
        run: >-
          clang-format -i
          src/gnss/rtklib_adapter.h
          src/gnss/rtklib_bias_adapter.cpp
          src/gnss/rtklib_solution_adapter.cpp
          src/solution/solution_engine.cpp
          src/model/measurement_model.h
          src/model/measurement_model.cpp
          src/output/truth_writer.cpp
          src/gnss/nav_output_record.h
          src/gnss/rtklib_nav_output_adapter.cpp
          src/core/simulator.cpp
          src/output/novatel_nav_writer.cpp
          src/output/unicore_nav_writer.cpp
          src/gnss/rtklib_adapter.cpp
          tests/unit/test_measurement_model.cpp
          tests/unit/test_solution_engine.cpp
          tests/unit/test_rtklib_adapter.cpp
          tests/integration/test_all_signal_residuals.cpp

      - name: Check materialized patch whitespace
        run: git diff --check

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test full suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Print compact residual diagnostics
        run: >-
          ./build/gnss_sim_integration_tests
          --gtest_filter=V1Acceptance.EveryFrozenSignalRunsTruthStateCodeAndDopplerResidualChecks

      - name: Probe provenance-pinned real DLR GPS modern companions
        run: |
          set -euo pipefail
          cp tests/integration/test_all_signal_residuals.cpp /tmp/test_all_signal_residuals.materialized.cpp
          curl -fsSL --retry 3 --retry-delay 1 \
            'https://raw.githubusercontent.com/neilberkman/sidereon/267b28f69f7678921c11689531f8fa250e7cca78/crates/sidereon-core/tests/fixtures/nav/BRD400DLR_S_20261800000_01H_MN_trim.rnx' \
            -o /tmp/issue51_brd400dlr_2026180_trim.rnx
          curl -fsSL --retry 3 --retry-delay 1 \
            'https://raw.githubusercontent.com/CS-SI/Orekit/c5b14ff008eb02482ad4e2a2347c97ce4800969c/src/test/resources/gnss/navigation/Example_GPS_Rinex400.n' \
            -o /tmp/issue51_orekit_dlr_2022278_gps.rnx
          python tools/apply_issue51_real_gps_modern_probe.py
          clang-format -i tests/integration/test_all_signal_residuals.cpp
          cmake --build build --config Release --parallel
          ./build/gnss_sim_integration_tests \
            --gtest_filter=V1Acceptance.RealDlrGpsModernCompanionsExposePinnedRtklibStatus
          cp /tmp/test_all_signal_residuals.materialized.cpp tests/integration/test_all_signal_residuals.cpp
          git diff --check

      - name: Commit materialized implementation only after green validation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt third_party/RTKLIB src tests
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit'
            exit 1
          fi
          git commit -m 'Materialize all-signal residual validation fixes'
          git push origin HEAD:issue-51-all-signal-residuals
