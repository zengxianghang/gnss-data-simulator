name: real-cn0-validation-issue108

on:
  push:
    branches:
      - issue-108-cn0-validation-clean

permissions:
  contents: read

jobs:
  validate-real-whu:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout with pinned dependencies
        uses: actions/checkout@v4
        with:
          ref: issue-108-cn0-validation-clean
          submodules: recursive

      - name: Configure and build production CN0 builder
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON
          cmake --build build --config Release --parallel --target build-cn0-model

      - name: Install pinned standard Hatanaka converter
        run: |
          python3 -m pip install --disable-pip-version-check hatanaka==2.8.1
          rinex-decompress --help >/dev/null

      - name: Download authentic WHU IGS OBS and matching BRD4 NAV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p real_cn0/input real_cn0/evidence
          base='ftp://igs.gnsswhu.cn/pub/gps/data/daily/2025/003'
          files=(
            '25d/WTZR00DEU_R_20250030000_01D_30S_MO.crx.gz'
            '25d/BRUX00BEL_R_20250030000_01D_30S_MO.crx.gz'
            '25o/TWTF00TWN_R_20250030000_01D_30S_MO.rnx.gz'
            '25o/AUCK00NZL_R_20250030000_01D_30S_MO.rnx.gz'
            '25o/SCTB00ATA_R_20250030000_01D_30S_MO.rnx.gz'
            '25p/BRD400DLR_S_20250030000_01D_MN.rnx.gz'
          )
          for remote in "${files[@]}"; do
            name="${remote##*/}"
            echo "Downloading ${remote}"
            curl --fail --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 600 \
              --output "real_cn0/input/${name}" "${base}/${remote}"
          done
          sha256sum real_cn0/input/* | sort > real_cn0/evidence/download_sha256.txt
          ls -l real_cn0/input > real_cn0/evidence/download_sizes.txt

      - name: Restore/decompress RINEX without modifying observations
        shell: bash
        run: |
          set -euo pipefail
          cd real_cn0/input
          rinex-decompress WTZR00DEU_R_20250030000_01D_30S_MO.crx.gz
          rinex-decompress BRUX00BEL_R_20250030000_01D_30S_MO.crx.gz
          gunzip -k TWTF00TWN_R_20250030000_01D_30S_MO.rnx.gz
          gunzip -k AUCK00NZL_R_20250030000_01D_30S_MO.rnx.gz
          gunzip -k SCTB00ATA_R_20250030000_01D_30S_MO.rnx.gz
          gunzip -k BRD400DLR_S_20250030000_01D_MN.rnx.gz
          ls -lh
          sha256sum *.rnx | sort > ../evidence/builder_input_sha256.txt
          stat --printf='%n %s\n' *.rnx | sort > ../evidence/builder_input_sizes.txt

      - name: Record exact RINEX header provenance
        shell: bash
        run: |
          set -euo pipefail
          : > real_cn0/evidence/rinex_headers.txt
          for obs in \
            real_cn0/input/WTZR00DEU_R_20250030000_01D_30S_MO.rnx \
            real_cn0/input/BRUX00BEL_R_20250030000_01D_30S_MO.rnx \
            real_cn0/input/TWTF00TWN_R_20250030000_01D_30S_MO.rnx \
            real_cn0/input/AUCK00NZL_R_20250030000_01D_30S_MO.rnx \
            real_cn0/input/SCTB00ATA_R_20250030000_01D_30S_MO.rnx; do
            echo "===== ${obs##*/} =====" | tee -a real_cn0/evidence/rinex_headers.txt
            awk '{print} /END OF HEADER/{exit}' "$obs" \
              | grep -E 'RINEX VERSION / TYPE|MARKER NAME|REC # / TYPE / VERS|ANT # / TYPE|APPROX POSITION XYZ|INTERVAL|SIGNAL STRENGTH UNIT|SYS / # / OBS TYPES' \
              | tee -a real_cn0/evidence/rinex_headers.txt || true
          done
          echo "===== BRD4 NAV =====" | tee -a real_cn0/evidence/rinex_headers.txt
          head -n 12 real_cn0/input/BRD400DLR_S_20250030000_01D_MN.rnx \
            | tee -a real_cn0/evidence/rinex_headers.txt
          printf 'tested_commit=%s\n' "$(git rev-parse HEAD)" > real_cn0/evidence/tested_commit.txt
          printf 'rtklib_commit=%s\n' "$(git -C third_party/RTKLIB rev-parse HEAD)" >> real_cn0/evidence/tested_commit.txt
          printf 'hatanka_package=hatanaka==2.8.1\n' >> real_cn0/evidence/tested_commit.txt

      - name: Build normalized CN0 model through production path
        shell: bash
        run: |
          set -euo pipefail
          nav='real_cn0/input/BRD400DLR_S_20250030000_01D_MN.rnx'
          ./build/build-cn0-model \
            --source real_cn0/input/WTZR00DEU_R_20250030000_01D_30S_MO.rnx "$nav" \
            --source real_cn0/input/BRUX00BEL_R_20250030000_01D_30S_MO.rnx "$nav" \
            --source real_cn0/input/TWTF00TWN_R_20250030000_01D_30S_MO.rnx "$nav" \
            --source real_cn0/input/AUCK00NZL_R_20250030000_01D_30S_MO.rnx "$nav" \
            --source real_cn0/input/SCTB00ATA_R_20250030000_01D_30S_MO.rnx "$nav" \
            --output real_cn0/evidence/cn0_model_v2.csv \
            --metadata real_cn0/evidence/cn0_model_v2.meta.json \
            --model-semantic normalized \
            2>&1 | tee real_cn0/evidence/builder.log

      - name: Quantify predeclared cross-station MPAD
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/cn0_validation/analyze_cn0_normalization.py \
            --metadata real_cn0/evidence/cn0_model_v2.meta.json \
            --output-prefix real_cn0/evidence/cn0_normalization_validation \
            --min-stations 3 \
            2>&1 | tee real_cn0/evidence/analyzer.log
          cat real_cn0/evidence/cn0_normalization_validation.json

      - name: Upload compact validation evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-108-real-whu-cn0-evidence
          path: real_cn0/evidence/
          if-no-files-found: warn
          retention-days: 30
