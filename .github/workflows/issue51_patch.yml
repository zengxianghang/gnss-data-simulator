name: issue51-patch
on:
  push:
    branches: [issue-51-all-signal-residuals]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          submodules: recursive
      - name: Wire dependency and test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CMakeLists.txt')
          s=p.read_text()
          s=s.replace('set(GNSS_SIM_RTKLIB_COMMIT "dc596ba725ccaa5ab5963d7e7ec85b52ae743969" CACHE STRING',
                      'set(GNSS_SIM_RTKLIB_COMMIT "94cda3254ab5f1f4ee923456ebf96065820dc23d" CACHE STRING',1)
          anchor='    third_party/RTKLIB/src/rtklib_pntvel_ext.c\n'
          if anchor not in s: raise SystemExit('rtklib source anchor missing')
          s=s.replace(anchor,anchor+'    third_party/RTKLIB/src/rtklib_residual_ext.c\n',1)
          anchor='        tests/integration/test_scenarios.cpp\n'
          if anchor not in s: raise SystemExit('integration test anchor missing')
          s=s.replace(anchor,anchor+'        tests/integration/test_all_signal_residuals.cpp\n',1)
          p.write_text(s)
          PY
          git diff --check
          git rm .github/workflows/issue51_patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt tests/integration/test_all_signal_residuals.cpp third_party/RTKLIB
          git commit -m 'test: wire all-signal RTKLIB residual validation'
          git push origin HEAD:issue-51-all-signal-residuals
