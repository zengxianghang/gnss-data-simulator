name: Apply GLONASS L3OC simulator patch

# Guarded compact residual validation against RTKLIB 8d252915.
on:
  push:
    branches:
      - issue-51-all-signal-residuals
    paths:
      - tools/apply_issue51_glo_l3oc_patch.py
      - tools/apply_issue51_rtklib_link_fix.py
      - tools/apply_issue51_doppler_family_policy.py
      - tools/apply_issue51_requested_family_validation.py
      - tools/apply_issue51_code_state_family.py
      - tools/apply_issue51_code_state_availability.py
      - tools/apply_issue51_solution_engine_signature.py
      - tools/apply_issue51_spp_family_nav.py
      - tools/apply_issue51_multisite_coverage.py
      - .github/workflows/apply-issue51-glo-l3oc.yml

permissions:
  contents: read

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Draft branch with dependencies
        uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Syntax-check guarded patch drivers
        run: >-
          python -m py_compile
          tools/apply_issue51_glo_l3oc_patch.py
          tools/apply_issue51_rtklib_link_fix.py
          tools/apply_issue51_doppler_family_policy.py
          tools/apply_issue51_requested_family_validation.py
          tools/apply_issue51_code_state_family.py
          tools/apply_issue51_code_state_availability.py
          tools/apply_issue51_solution_engine_signature.py
          tools/apply_issue51_spp_family_nav.py
          tools/apply_issue51_multisite_coverage.py

      - name: Apply guarded implementation and multi-site validation
        run: |
          python tools/apply_issue51_glo_l3oc_patch.py
          python tools/apply_issue51_rtklib_link_fix.py
          python tools/apply_issue51_doppler_family_policy.py
          python tools/apply_issue51_code_state_family.py
          python tools/apply_issue51_code_state_availability.py
          python tools/apply_issue51_solution_engine_signature.py
          python tools/apply_issue51_spp_family_nav.py
          python tools/apply_issue51_requested_family_validation.py
          python tools/apply_issue51_multisite_coverage.py

      - name: Format modified C and C++ sources
        run: >-
          clang-format -i
          src/gnss/rtklib_adapter.h
          src/gnss/rtklib_bias_adapter.cpp
          src/gnss/rtklib_solution_adapter.cpp
          src/solution/solution_engine.cpp
          src/model/measurement_model.h
          src/model/measurement_model.cpp
          src/output/truth_writer.cpp
          src/gnss/nav_output_record.h
          src/gnss/rtklib_nav_output_adapter.cpp
          src/core/simulator.cpp
          src/output/novatel_nav_writer.cpp
          src/output/unicore_nav_writer.cpp
          src/gnss/rtklib_adapter.cpp
          tests/unit/test_measurement_model.cpp
          tests/unit/test_solution_engine.cpp
          tests/integration/test_all_signal_residuals.cpp

      - name: Check patch whitespace
        run: git diff --check

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test full suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Print GPS CNAV residual diagnostics
        run: >-
          ./build/gnss_sim_integration_tests
          --gtest_filter=V1Acceptance.EveryFrozenSignalRunsTruthStateCodeAndDopplerResidualChecks

      - name: Discover real GPS CNV2 records in full-day BRD400DLR
        continue-on-error: true
        run: |
          set -euo pipefail
          bkg='https://igs.bkg.bund.de/root_ftp/IGS/BRDC/2025/003/BRD400DLR_S_20250030000_01D_MN.rnx.gz'
          ign='ftp://igs.ign.fr/pub/igs/data/2025/003/BRD400DLR_S_20250030000_01D_MN.rnx.gz'
          source_url=''
          for url in "${bkg}" "${ign}"; do
            echo "CNV2_SOURCE_ATTEMPT ${url}"
            if curl -4 -fsSL --connect-timeout 12 --max-time 75 --retry 1 --retry-delay 2 "${url}" -o /tmp/brd400dlr_2025003.rnx.gz; then
              source_url="${url}"
              break
            fi
          done
          if [ -z "${source_url}" ]; then
            echo 'CNV2_SOURCE_UNAVAILABLE BKG_HTTPS_AND_IGN_FTP'
            exit 1
          fi
          echo "CNV2_SOURCE_OK ${source_url}"
          gzip -dc /tmp/brd400dlr_2025003.rnx.gz > /tmp/brd400dlr_2025003.rnx
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path

          lines = Path('/tmp/brd400dlr_2025003.rnx').read_text(errors='strict').splitlines()
          records = []
          i = 0
          while i < len(lines):
              if not (lines[i].startswith('> EPH G') and 'CNV2' in lines[i]):
                  i += 1
                  continue
              j = i + 1
              while j < len(lines) and not lines[j].startswith('>'):
                  j += 1
              block = lines[i:j]
              epoch = None
              if len(block) >= 2:
                  fields = block[1].split()
                  try:
                      epoch = datetime(int(fields[1]), int(fields[2]), int(fields[3]), int(fields[4]), int(fields[5]),
                                       int(float(fields[6])))
                  except (ValueError, IndexError):
                      pass
              records.append((epoch, block))
              i = j

          target = datetime(2025, 1, 3, 1, 15, 0)
          print(f'CNV2_COUNT {len(records)}')
          candidates = sorted(records, key=lambda item: abs((item[0] - target).total_seconds()) if item[0] else 1e99)
          for rank, (epoch, block) in enumerate(candidates[:8], start=1):
              age = abs((epoch - target).total_seconds()) if epoch else float('inf')
              print(f'CNV2_CANDIDATE rank={rank} epoch={epoch} target_age_sec={age:.0f}')
              print('\n'.join(block))
              print('CNV2_CANDIDATE_END')
          if not records:
              raise SystemExit('no GPS CNV2 record found in full-day BRD400DLR')
          PY

      - name: Diagnostic branch remains uncommitted
        run: |
          echo 'Guarded implementation validated in the worktree only.'
          echo 'No source commit is made until GPS modern-family coverage is strict again.'
