name: Temporary RANGEA error diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build diagnostic targets
        run: cmake --build build --config Release --parallel --target gnss-data-simulator validate-rangea-roundtrip validate-residuals

      - name: Download pinned WHU RINEX NAV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/igs
          gz=.cache/igs/BRD400DLR_S_20250030000_01D_MN.rnx.gz
          nav=.cache/igs/BRD400DLR_S_20250030000_01D_MN.rnx
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 \
            ftp://igs.gnsswhu.cn/pub/gps/data/daily/2025/brdc/BRD400DLR_S_20250030000_01D_MN.rnx.gz -o "$gz"
          echo 'fb84d4046b06e905e8e4ec0efb82f0e9ad044bc44d664cc0209cb9b4c92b9512  '"$gz" | sha256sum -c -
          gzip -dc "$gz" > "$nav"
          echo 'b11c638eea42978b8bd6aa8b65a5099fe6556dfe527bc037ed481d2b239afc42  '"$nav" | sha256sum -c -

      - name: Generate 10 minute zero-noise case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag
          cat > diag/config.json <<'JSON'
          {
            "schema_version": 1,
            "scenario": "KS",
            "duration_sec": 600,
            "sampling_rate_hz": 1,
            "elevation_mask_deg": 0.0,
            "output_eph": true,
            "output_ion": true,
            "measurement_noise_enabled": false,
            "multipath_enabled": false,
            "receiver_clock_bias_m": 0.0,
            "receiver_clock_drift_mps": 0.0,
            "atmosphere_mode": "broadcast",
            "receiver": {"latitude_deg": 20.0, "longitude_deg": 120.0, "height_m": 100.0},
            "ttff": {"startup_mode": "HOT", "power_on_sec": 300.0, "power_off_sec": 30.0},
            "rea": {"signal_on_sec": 300.0, "signal_off_sec": 10.0},
            "seed": 96
          }
          JSON
          build/gnss-data-simulator --config diag/config.json \
            --nav .cache/igs/BRD400DLR_S_20250030000_01D_MN.rnx \
            --output diag/simulated.log --week 2347 --sow 436500

      - name: Compare in-memory SPP with RANGEA round-trip
        shell: bash
        run: |
          set -euo pipefail
          build/validate-rangea-roundtrip \
            --log diag/simulated.log \
            --nav .cache/igs/BRD400DLR_S_20250030000_01D_MN.rnx \
            --truth-lat 20 --truth-lon 120 --truth-height 100 \
            --elevation-mask 0 --broadcast-atmosphere | tee diag/roundtrip.txt

          python3 - <<'PY'
          import csv, math

          A = 6378137.0
          F = 1.0 / 298.257223563
          E2 = F * (2.0 - F)
          def ecef(lat_deg, lon_deg, h):
              lat = math.radians(lat_deg); lon = math.radians(lon_deg)
              s = math.sin(lat); c = math.cos(lat)
              n = A / math.sqrt(1.0 - E2*s*s)
              return ((n+h)*c*math.cos(lon), (n+h)*c*math.sin(lon), (n*(1.0-E2)+h)*s)

          truth = ecef(20.0, 120.0, 100.0)
          rows=[]
          with open('diag/solution_truth.csv', newline='') as f:
              for r in csv.DictReader(f):
                  if r['position_valid'] != '1':
                      continue
                  xyz=(float(r['position_x_m']), float(r['position_y_m']), float(r['position_z_m']))
                  err=math.sqrt(sum((xyz[i]-truth[i])**2 for i in range(3)))
                  rows.append((err, int(r['gps_week']), float(r['sow_sec']), int(r['position_used_satellites']), float(r['receiver_clock_bias_m'])))
          rows.sort(reverse=True)
          print('IN_MEMORY_TOP10')
          for x in rows[:10]: print('inmem_err_m=%.9f gpst=%d/%.3f ns=%d clk_m=%.6f' % x)
          print('IN_MEMORY_AROUND_437021')
          for x in sorted(rows, key=lambda v:v[2]):
              if 437015.0 <= x[2] <= 437027.0:
                  print('inmem_err_m=%.9f gpst=%d/%.3f ns=%d clk_m=%.6f' % x)
          PY

      - name: Compare practical elevation masks
        shell: bash
        run: |
          set -euo pipefail
          for mask in 0.5 1 3 5 10; do
            echo "MASK_DEG=${mask}"
            build/validate-rangea-roundtrip \
              --log diag/simulated.log \
              --nav .cache/igs/BRD400DLR_S_20250030000_01D_MN.rnx \
              --truth-lat 20 --truth-lon 120 --truth-height 100 \
              --elevation-mask "$mask" --broadcast-atmosphere
          done

      - name: Evaluate per-signal and per-satellite code residuals
        shell: bash
        run: |
          set -euo pipefail
          build/validate-residuals \
            --nav .cache/igs/BRD400DLR_S_20250030000_01D_MN.rnx \
            --truth diag/observation_truth.csv \
            --output diag/residual_summary.csv \
            --atmosphere broadcast --code-limit-m 1000 --doppler-limit-mps 1000 \
            | tee diag/residual_stdout.txt

          python3 - <<'PY'
          import csv
          rows=[]
          with open('diag/residual_summary.csv', newline='') as f:
              for r in csv.DictReader(f):
                  if r['scope'] == 'signal_family_satellite' and int(r['code_residuals']) > 0:
                      rows.append((float(r['code_max_abs_m']), r['signal_name'], r['family'], int(r['satellite_number']), float(r['code_max_sow_sec']), float(r['code_rms_m']), float(r['code_p95_abs_m'])))
          rows.sort(reverse=True)
          print('SATELLITE_CODE_RESIDUAL_TOP30')
          for x in rows[:30]:
              print('code_max_m=%.9f signal=%s family=%s sat=%d max_sow=%.3f rms=%.9f p95=%.9f' % x)
          PY

      - name: Print target observation model rows
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          print('OBSERVATIONS_AT_437021')
          with open('diag/observation_truth.csv', newline='') as f:
              for r in csv.DictReader(f):
                  if abs(float(r['sow_sec'])-437021.0) < 0.001 and r['pseudorange_valid']=='1':
                      print('signal=%s sat=%s family=%s el=%s geom=%s clk=%s iono=%s tropo=%s bias=%s psr=%s' % (
                          r['signal_name'], r['satellite_number'], r['broadcast_message_family'], r['elevation_deg'],
                          r['geometric_range_m'], r['satellite_clock_bias_m'], r['ionosphere_m'], r['troposphere_m'],
                          r['code_bias_m'], r['pseudorange_m']))
          PY
