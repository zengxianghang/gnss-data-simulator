name: Temporary repin RTKLIB generic Doppler fix

on:
  push:
    branches:
      - issue-51-all-signal-residuals

permissions:
  contents: write

jobs:
  repin-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with submodules
        uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          fetch-depth: 0
          submodules: recursive

      - name: Advance RTKLIB pin and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rtklib_sha='a5bc61990133830704f5040b7b9983b9b1e02681'
          git -C third_party/RTKLIB fetch origin "$rtklib_sha"
          git -C third_party/RTKLIB checkout --detach "$rtklib_sha"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CMakeLists.txt')
          text = path.read_text()
          old = '81e15b717ade0a5a91e365ed91511d414803dc05'
          new = 'a5bc61990133830704f5040b7b9983b9b1e02681'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old RTKLIB pin, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/temporary-repin-rtklib-generic-doppler.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt third_party/RTKLIB .github/workflows/temporary-repin-rtklib-generic-doppler.yml
          git commit -m "deps: advance RTKLIB generic Doppler state fix"
          git push origin HEAD:issue-51-all-signal-residuals
