name: replay-issue108

on:
  push:
    branches:
      - issue-108-cn0-validation-clean

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-108-cn0-validation-clean
          fetch-depth: 0
      - name: Replay only reviewed #108 files
        shell: bash
        run: |
          git fetch origin issue-108-cn0-validation
          git checkout origin/issue-108-cn0-validation -- \
            .github/workflows/ci.yml \
            tests/unit/test_cn0_normalized_builder.cpp \
            tools/cn0_validation/analyze_cn0_normalization.py
          git status --short
      - name: Commit replay
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml tests/unit/test_cn0_normalized_builder.cpp tools/cn0_validation/analyze_cn0_normalization.py
          git commit -m "test: add deterministic multi-station CN0 normalization validation"
          git push origin HEAD:issue-108-cn0-validation-clean
