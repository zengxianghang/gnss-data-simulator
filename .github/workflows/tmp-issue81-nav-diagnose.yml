name: tmp-issue81-nav-diagnose
on:
  push:
    branches:
      - issue-81-serialized-nav-roundtrip
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure and build
        run: |
          cmake -S . -B build -DBUILD_TESTING=OFF
          cmake --build build --parallel
      - name: Build diagnostic
        shell: bash
        run: |
          cat > /tmp/nav_diag.cpp <<'EOF'
          #include "gnss_sim/sim_config.h"
          #include "gnss_sim/sim_time.h"
          #include "gnss_sim/simulator.h"
          #include "gnss/rtklib_adapter.h"
          #include "serialized_nav_parser.h"
          #include <cmath>
          #include <fstream>
          #include <iostream>
          #include <string>

          static const char* signal_code(gnss_sim::NavOutputSystem system) {
              switch (system) {
                  case gnss_sim::NavOutputSystem::kGps: return "1C";
                  case gnss_sim::NavOutputSystem::kGlonass: return "1C";
                  case gnss_sim::NavOutputSystem::kGalileo: return "1C";
                  case gnss_sim::NavOutputSystem::kBeidou: return "2I";
                  case gnss_sim::NavOutputSystem::kQzss: return "1C";
                  default: return nullptr;
              }
          }

          static void compare_record(const gnss_sim::ParsedSerializedNavRecord& parsed,
                                     const gnss_sim::RtklibNavStore* source,
                                     const gnss_sim::RtklibNavStore* rebuilt) {
              gnss_sim::NavOutputSystem system = gnss_sim::NavOutputSystem::kUnknown;
              gnss_sim::RtklibBroadcastMessageFamily family = gnss_sim::RtklibBroadcastMessageFamily::kUnknown;
              int sat = 0;
              if (parsed.record.kind == gnss_sim::RtklibNavRecordKind::kEphemeris) {
                  system = parsed.record.ephemeris.system;
                  family = parsed.record.ephemeris.message_family;
                  sat = parsed.record.ephemeris.satellite_number;
              } else if (parsed.record.kind == gnss_sim::RtklibNavRecordKind::kGlonassEphemeris) {
                  system = gnss_sim::NavOutputSystem::kGlonass;
                  family = gnss_sim::RtklibBroadcastMessageFamily::kGlonassFdma;
                  sat = parsed.record.glonass.satellite_number;
              } else {
                  return;
              }
              const char* rinex_code = signal_code(system);
              if (rinex_code == nullptr) return;
              int code = 0, freq = 0;
              if (!gnss_sim::rtklib_observation_code(rinex_code, &code, &freq)) return;
              gnss_sim::RtklibSatelliteState a{}, b{};
              std::string error;
              const bool oka = gnss_sim::get_rtklib_signal_satellite_state(
                  source, parsed.output_gps_week, parsed.output_sow_sec, sat, code, family, &a, &error);
              if (!oka) {
                  std::cout << "SOURCE_FAIL sat=" << sat << " family=" << static_cast<int>(family)
                            << " err=" << error << "\n";
                  return;
              }
              error.clear();
              const bool okb = gnss_sim::get_rtklib_signal_satellite_state(
                  rebuilt, parsed.output_gps_week, parsed.output_sow_sec, sat, code, family, &b, &error);
              if (!okb) {
                  std::cout << "REBUILT_FAIL sat=" << sat << " family=" << static_cast<int>(family)
                            << " err=" << error << "\n";
                  return;
              }
              const double dx=a.position_ecef_m[0]-b.position_ecef_m[0];
              const double dy=a.position_ecef_m[1]-b.position_ecef_m[1];
              const double dz=a.position_ecef_m[2]-b.position_ecef_m[2];
              const double pos=std::sqrt(dx*dx+dy*dy+dz*dz);
              const double clk=std::abs(a.clock_bias_sec-b.clock_bias_sec)*299792458.0;
              gnss_sim::RtklibBroadcastBiasData ba{}, bb{};
              double tgd0=-9999.0, tgd1=-9999.0;
              error.clear();
              if (gnss_sim::rtklib_broadcast_bias_data_for_family(
                      source, parsed.output_gps_week, parsed.output_sow_sec, sat, family, &ba, &error) &&
                  gnss_sim::rtklib_broadcast_bias_data_for_family(
                      rebuilt, parsed.output_gps_week, parsed.output_sow_sec, sat, family, &bb, &error)) {
                  tgd0=(ba.tgd_sec[0]-bb.tgd_sec[0])*299792458.0;
                  tgd1=(ba.tgd_sec[1]-bb.tgd_sec[1])*299792458.0;
              }
              char id[4]{};
              gnss_sim::rtklib_satellite_number_to_id(sat,id);
              std::cout << "NAVDIFF id=" << id << " family=" << static_cast<int>(family)
                        << " t=" << parsed.output_gps_week << "/" << parsed.output_sow_sec
                        << " pos_m=" << pos << " clk_m=" << clk
                        << " tgd0_m=" << tgd0 << " tgd1_m=" << tgd1
                        << " health=" << a.health << "/" << b.health << "\n";
          }

          int main() {
              const std::string nav_path="tests/data/minimal/brd400dlr_rinex4_acceptance_nav.rnx";
              const std::string log_path="/tmp/issue81.log";
              gnss_sim::SimConfig cfg=gnss_sim::default_sim_config();
              cfg.scenario=gnss_sim::ScenarioType::KS;
              cfg.atmosphere_mode=gnss_sim::AtmosphereMode::BROADCAST;
              cfg.sampling_rate_hz=1;
              cfg.duration_ns=60LL*gnss_sim::NANOSECONDS_PER_SECOND;
              cfg.elevation_mask_deg=0.0;
              cfg.solution_elevation_mask_deg=5.0;
              cfg.receiver={20.0,120.0,100.0};
              cfg.measurement_noise_enabled=false;
              cfg.multipath_enabled=false;
              cfg.output_eph=true;
              cfg.output_ion=true;
              cfg.seed=0x60U;
              gnss_sim::SimTime start{};
              gnss_sim::sim_time_from_week_sow(2347,436500.0,&start);
              gnss_sim::SimulatorRunOptions opt{nav_path.c_str(),log_path.c_str(),start};
              gnss_sim::SimulatorRunSummary sum{};
              std::string error;
              if (!gnss_sim::run_simulator(cfg,opt,&sum,&error)) {
                  std::cerr << "sim fail: " << error << "\n"; return 2;
              }
              auto* full=gnss_sim::create_rtklib_nav_store();
              auto* source=gnss_sim::create_rtklib_nav_store();
              auto* rebuilt=gnss_sim::create_rtklib_nav_store();
              if (!full||!source||!rebuilt||!gnss_sim::load_rinex_nav_file(full,nav_path.c_str(),&error)) {
                  std::cerr << "nav load fail: " << error << "\n"; return 3;
              }
              std::ifstream in(log_path);
              std::string line;
              while (std::getline(in,line)) {
                  gnss_sim::ParsedSerializedNavRecord parsed{};
                  bool recognized=false;
                  error.clear();
                  if (!gnss_sim::parse_serialized_novatel_nav_line_independent(line,&parsed,&recognized,&error)) {
                      std::cerr << "parse fail: " << error << "\n"; return 4;
                  }
                  if (!recognized) continue;
                  if (!gnss_sim::rtklib_copy_nav_snapshot(full,parsed.output_gps_week,parsed.output_sow_sec,source,&error)) {
                      std::cerr << "snapshot fail: " << error << "\n"; return 5;
                  }
                  if (!gnss_sim::rtklib_append_nav_output_record(rebuilt,parsed.record,&error)) {
                      std::cerr << "append fail: " << error << "\n"; return 6;
                  }
                  compare_record(parsed,source,rebuilt);
              }
              gnss_sim::destroy_rtklib_nav_store(full);
              gnss_sim::destroy_rtklib_nav_store(source);
              gnss_sim::destroy_rtklib_nav_store(rebuilt);
              return 0;
          }
          EOF
          c++ -std=c++17 -Iinclude -Isrc -Itools/rangea_roundtrip -Ithird_party/RTKLIB/src \
            /tmp/nav_diag.cpp build/librangea_roundtrip_core.a build/libgnss_sim_core.a \
            build/librtklib_pinned.a build/libcjson_vendor.a -lpthread -lm -o /tmp/nav_diag
      - name: Run diagnostic
        run: /tmp/nav_diag
