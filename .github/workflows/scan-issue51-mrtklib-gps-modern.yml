name: Scan real DLR GPS CNV2 candidates

on:
  push:
    branches:
      - issue-51-all-signal-residuals
    paths:
      - .github/workflows/scan-issue51-mrtklib-gps-modern.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
      - name: Extract first GPS CNV2 block from provenance-pinned DLR fixture
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/h-shiono/MRTKLIB/8781ebf1448251544be7c7273a06176641510c24/tests/data/rinex4/BRD400DLR_S_20260680000_01D_MN.rnx.gz'
          echo "GPS_CNV2_PROVENANCE repo=h-shiono/MRTKLIB commit=8781ebf1448251544be7c7273a06176641510c24 file=BRD400DLR_S_20260680000_01D_MN.rnx.gz"
          curl -fsSL --connect-timeout 5 --max-time 60 --retry 2 --retry-delay 1 "${url}" -o /tmp/brd4.rnx.gz
          gunzip -c /tmp/brd4.rnx.gz > /tmp/brd4.rnx
          echo "GPS_CNV2_COUNT=$(grep -Ec '^> EPH G[0-9][0-9] CNV2' /tmp/brd4.rnx || true)"
          echo "GPS_CNAV_COUNT=$(grep -Ec '^> EPH G[0-9][0-9] CNAV' /tmp/brd4.rnx || true)"
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/brd4.rnx').read_text().splitlines()
          for i, line in enumerate(lines):
              if line.startswith('> EPH G') and line.rstrip().endswith(' CNV2'):
                  print('GPS_CNV2_BLOCK_BEGIN')
                  j = i
                  while j < len(lines):
                      if j > i and lines[j].startswith('>'):
                          break
                      print(lines[j])
                      j += 1
                  print('GPS_CNV2_BLOCK_END')
                  break
          else:
              raise SystemExit('no GPS CNV2 block in pinned DLR fixture')
          PY
