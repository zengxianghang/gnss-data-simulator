name: tmp-issue79-format

on:
  push:
    branches:
      - issue-79-bestpos-mirror-psrpos

jobs:
  format:
    if: github.event.head_commit.message == 'Apply clang-format for issue 79'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-79-bestpos-mirror-psrpos
          submodules: false
      - name: Apply repository clang-format
        shell: bash
        run: |
          mapfile -t files < <(find include src tests tools -type f \( -name '*.h' -o -name '*.c' -o -name '*.cpp' \) | sort)
          clang-format -i "${files[@]}"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include src tests tools
          if ! git diff --cached --quiet; then
            git commit -m "Format issue 79 changes"
            git push origin HEAD:issue-79-bestpos-mirror-psrpos
          fi
