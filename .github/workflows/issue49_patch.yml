name: issue49-patch-helper

on:
  push:
    branches:
      - issue-49-rtklib-atmosphere-parity

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply remaining atmosphere parity patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          simulator = Path('src/core/simulator.cpp')
          text = simulator.read_text()
          old = '''        const double elevation_deg = geometry.elevation_rad * kRadiansToDegrees;
          bool satellite_tracking = false;
          for (SignalRuntime& signal : satellite.signals) {'''
          new = '''        int glonass_fcn = 0;
          if (satellite.constellation == GnssConstellation::kGlonass) {
              RtklibBroadcastBiasData bias_data{};
              if (!rtklib_broadcast_bias_data(truth_nav, geometry.transmit_gps_week, geometry.transmit_sow_sec,
                                              satellite.satellite_number, &bias_data, error_message)) {
                  return false;
              }
              glonass_fcn = bias_data.glonass_fcn;
          }
          const double elevation_deg = geometry.elevation_rad * kRadiansToDegrees;
          bool satellite_tracking = false;
          for (SignalRuntime& signal : satellite.signals) {'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'int glonass_fcn = 0;' not in text:
              raise SystemExit('simulator insertion anchor not found')
          old_call = '''                                               signal.tracker.signal_id, 0, runtime->receiver.position_ecef_m,
                                                 geometry.azimuth_rad, geometry.elevation_rad, &atmosphere,'''
          new_call = '''                                               signal.tracker.signal_id, glonass_fcn,
                                                 runtime->receiver.position_ecef_m, geometry.azimuth_rad,
                                                 geometry.elevation_rad, &atmosphere,'''
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif 'signal.tracker.signal_id, glonass_fcn,' not in text:
              raise SystemExit('atmosphere call anchor not found')
          simulator.write_text(text)

          acceptance = Path('tests/integration/test_v1_acceptance.cpp')
          text = acceptance.read_text()
          if '#include "gnss/rtklib_adapter.h"' not in text:
              text = text.replace('#include "gnss/signal_definitions.h"\n',
                                  '#include "gnss/rtklib_adapter.h"\n#include "gnss/signal_definitions.h"\n', 1)
          if '#include <cmath>' not in text:
              text = text.replace('#include <array>\n', '#include <array>\n#include <cmath>\n', 1)
          if '#include <limits>' not in text:
              text = text.replace('#include <gtest/gtest.h>\n', '#include <gtest/gtest.h>\n#include <limits>\n', 1)

          helper = r'''
          double max_valid_position_error_m(const std::filesystem::path& solution_path, double truth_latitude_deg,
                                            double truth_longitude_deg, double truth_height_m,
                                            std::uint64_t* valid_position_count) {
              double truth_ecef[3]{};
              EXPECT_TRUE(gnss_sim::rtklib_llh_to_ecef(truth_latitude_deg, truth_longitude_deg, truth_height_m,
                                                        truth_ecef));
              std::ifstream input(solution_path);
              std::string line;
              if (!std::getline(input, line)) {
                  return std::numeric_limits<double>::infinity();
              }
              double maximum_error_m = 0.0;
              std::uint64_t count = 0;
              while (std::getline(input, line)) {
                  std::vector<std::string> fields;
                  std::istringstream stream(line);
                  std::string field;
                  while (std::getline(stream, field, ',')) {
                      fields.push_back(field);
                  }
                  if (fields.size() < 13U || fields[4] != "1") {
                      continue;
                  }
                  const double dx = std::stod(fields[10]) - truth_ecef[0];
                  const double dy = std::stod(fields[11]) - truth_ecef[1];
                  const double dz = std::stod(fields[12]) - truth_ecef[2];
                  maximum_error_m = std::max(maximum_error_m, std::sqrt(dx * dx + dy * dy + dz * dz));
                  ++count;
              }
              if (valid_position_count != nullptr) {
                  *valid_position_count = count;
              }
              return count > 0 ? maximum_error_m : std::numeric_limits<double>::infinity();
          }

          '''
          cleanup_anchor = 'void cleanup(const std::filesystem::path& path) {'
          if 'double max_valid_position_error_m(' not in text:
              if cleanup_anchor not in text:
                  raise SystemExit('acceptance helper anchor not found')
              text = text.replace(cleanup_anchor, helper + cleanup_anchor, 1)

          test = r'''
          TEST(V1Acceptance, RealBrd400DlrBroadcastAtmosphereMatchesReceiverSolutionConvention) {
              gnss_sim::SimConfig config = acceptance_config();
              config.atmosphere_mode = gnss_sim::AtmosphereMode::BROADCAST;
              config.sampling_rate_hz = 1;
              config.duration_ns = 60LL * gnss_sim::NANOSECONDS_PER_SECOND;
              config.receiver = {20.0, 120.0, 100.0};

              const std::filesystem::path directory = "gnss_sim_acceptance_brd4_broadcast_atmosphere";
              gnss_sim::SimulatorRunSummary summary{};
              std::string error_message;
              ASSERT_TRUE(
                  run_in_directory_with_nav(directory, config, brd4_nav_path(), brd4_start_time(), &summary, &error_message))
                  << error_message;

              expect_five_system_observations(directory / "observation_truth.csv");
              EXPECT_GT(summary.valid_position_epochs, 0U);
              std::uint64_t valid_position_count = 0;
              const double maximum_error_m =
                  max_valid_position_error_m(directory / "solution_truth.csv", 20.0, 120.0, 100.0, &valid_position_count);
              EXPECT_EQ(valid_position_count, summary.valid_position_epochs);
              EXPECT_LT(maximum_error_m, 0.5)
                  << "broadcast-atmosphere zero-noise loopback must not hide ion/trop convention mismatches";

              cleanup(directory);
          }

          '''
          test_anchor = 'TEST(V1Acceptance, SameInputConfigAndSeedProduceByteIdenticalReceiverAndTruthOutputs) {'
          if 'RealBrd400DlrBroadcastAtmosphereMatchesReceiverSolutionConvention' not in text:
              if test_anchor not in text:
                  raise SystemExit('acceptance test anchor not found')
              text = text.replace(test_anchor, test + test_anchor, 1)
          acceptance.write_text(text)
          PY

      - name: Format and run full tests
        shell: bash
        run: |
          set -euo pipefail
          clang-format -i src/core/simulator.cpp src/gnss/rtklib_atmosphere_adapter.cpp tests/unit/test_atmosphere_model.cpp tests/integration/test_v1_acceptance.cpp
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git add src/core/simulator.cpp src/gnss/rtklib_atmosphere_adapter.cpp tests/unit/test_atmosphere_model.cpp tests/integration/test_v1_acceptance.cpp
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "xianghang zeng"
          git config user.email "62739219+zengxianghang@users.noreply.github.com"
          git commit -m "fix: complete RTKLIB atmosphere parity"
          git push origin HEAD:issue-49-rtklib-atmosphere-parity
