name: issue51-nonfatal-bias

on:
  push:
    branches: [issue-51-all-signal-residuals]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          fetch-depth: 0
          submodules: recursive
      - name: Apply nonfatal missing-family semantics
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/model/measurement_model.cpp')
          s=p.read_text()
          old='''    RtklibBroadcastBiasData bias_data{};\n    if (!rtklib_broadcast_bias_data_for_family(\n            nav_store, geometry.transmit_gps_week, geometry.transmit_sow_sec, geometry.satellite_number,\n            requested_bias_family(signal->nav_message_family), &bias_data, error_message)) {\n        return false;\n    }\n\n    double wavelength_m = 0.0;'''
          new='''    RtklibBroadcastBiasData bias_data{};\n    const bool signal_family_bias_available = rtklib_broadcast_bias_data_for_family(\n        nav_store, geometry.transmit_gps_week, geometry.transmit_sow_sec, geometry.satellite_number,\n        requested_bias_family(signal->nav_message_family), &bias_data, nullptr);\n    if (!signal_family_bias_available &&\n        !rtklib_broadcast_bias_data(nav_store, geometry.transmit_gps_week, geometry.transmit_sow_sec,\n                                    geometry.satellite_number, &bias_data, error_message)) {\n        return false;\n    }\n\n    double wavelength_m = 0.0;'''
          if old not in s:
              raise SystemExit('measurement family-selection anchor not found')
          s=s.replace(old,new,1)
          old='''    if (!compute_broadcast_code_bias_m(*signal, bias_data, &result.code_bias_m, &result.code_bias_status,\n                                       error_message)) {\n        return false;\n    }'''
          new='''    if (!signal_family_bias_available) {\n        set_unavailable(&result.code_bias_m, &result.code_bias_status);\n    } else if (!compute_broadcast_code_bias_m(*signal, bias_data, &result.code_bias_m, &result.code_bias_status,\n                                              error_message)) {\n        return false;\n    }'''
          if old not in s:
              raise SystemExit('measurement bias-compute anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          clang-format -i src/model/measurement_model.cpp
          git diff --check
          git add src/model/measurement_model.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep missing signal-family bias nonfatal'
          git rm .github/workflows/issue51_nonfatal_bias.yml
          git commit -m 'ci: remove issue 51 nonfatal patch workflow'
          git push origin HEAD:issue-51-all-signal-residuals
