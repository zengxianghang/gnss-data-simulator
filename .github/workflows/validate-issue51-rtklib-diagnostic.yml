name: Validate RTKLIB diagnostic residual dependency

on:
  push:
    branches:
      - issue-51-all-signal-residuals
    paths:
      - .github/workflows/validate-issue51-rtklib-diagnostic.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          submodules: recursive
      - name: Checkout RTKLIB diagnostic head
        run: |
          set -euo pipefail
          git -C third_party/RTKLIB fetch origin issue-6-all-signal-residuals-bds-tgd
          git -C third_party/RTKLIB checkout 1805fdb6da7f2b561d5cbf27bc14e3e4e25224f1
      - name: Signal bias regressions
        run: make -C third_party/RTKLIB/tests/signal_bias_ext clean test
      - name: Residual regressions
        run: make -C third_party/RTKLIB/tests/residual_ext clean test
      - name: RINEX4 GLONASS family regression
        run: make -C third_party/RTKLIB/tests/rinex4_glo_l3oc clean test
      - name: Standalone pntpos compile
        run: >-
          cc -O2 -std=c99 -Wall -Wextra -pedantic
          -Ithird_party/RTKLIB/src -DENAGLO -DENAQZS -DENAGAL -DENACMP -DNFREQ=3
          -c third_party/RTKLIB/src/pntpos.c -o /tmp/pntpos.o
