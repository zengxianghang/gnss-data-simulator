name: tmp-issue116-cmake
on:
  push:
    branches: [issue-116-low-e-rf-model]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-116-low-e-rf-model
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('CMakeLists.txt')
          s=p.read_text()
          s=s.replace('    tests/unit/test_urban_rf_model.cpp\n    tests/unit/test_urban_scene_geometry.cpp\n', '        tests/unit/test_urban_rf_model.cpp\n        tests/unit/test_urban_scene_geometry.cpp\n')
          p.write_text(s)
          PY
          if git diff --quiet -- CMakeLists.txt; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "Fix issue 116 CMake source indentation"
          git push origin HEAD:issue-116-low-e-rf-model
