name: Apply Issue 56 patch

on:
  push:
    branches:
      - issue-56-ttff-device-markers
    paths:
      - .github/workflows/issue56-apply.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch with submodules
        uses: actions/checkout@v6
        with:
          ref: issue-56-ttff-device-markers
          submodules: recursive
          fetch-depth: 0

      - name: Apply focused source and test edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "src/core/simulator.cpp",
              '#include "model/signal_tracking.h"\n#include "output/novatel_nav_writer.h"',
              '#include "model/signal_tracking.h"\n#include "output/device_marker.h"\n#include "output/novatel_nav_writer.h"',
          )
          replace_once(
              "src/core/simulator.cpp",
              '''        if (scenario.power_on_transition) {\n            ++result.power_on_events;\n            if (!receiver_power_on(&runtime, config, current_time, &output, &result, error_message)) {\n                ok = false;\n                break;\n            }\n        }''',
              '''        if (scenario.power_on_transition) {\n            ++result.power_on_events;\n            if (config.scenario == ScenarioType::TTFF &&\n                !write_message(&output, simulator_device_marker(), error_message)) {\n                ok = false;\n                break;\n            }\n            if (!receiver_power_on(&runtime, config, current_time, &output, &result, error_message)) {\n                ok = false;\n                break;\n            }\n        }''',
          )

          replace_once(
              "tests/unit/test_output_writers.cpp",
              '#include "model/measurement_model.h"\n#include "output/novatel_ascii.h"',
              '#include "model/measurement_model.h"\n#include "output/device_marker.h"\n#include "output/novatel_ascii.h"',
          )
          replace_once(
              "tests/unit/test_output_writers.cpp",
              '''TEST(NovatelAscii, OfficialBestPosCrcVectorMatchesOem7Documentation) {''',
              '''TEST(SimulatorDeviceMarker, CanonicalMarkerIsByteStable) {\n    EXPECT_EQ(gnss_sim::simulator_device_marker(), "devicename=gnss-data-simulator\\r\\n");\n}\n\nTEST(NovatelAscii, OfficialBestPosCrcVectorMatchesOem7Documentation) {''',
          )

          replace_once(
              "tests/integration/test_scenarios.cpp",
              '#include "gnss_sim/sim_time.h"\n#include "gnss_sim/simulator.h"',
              '#include "gnss_sim/sim_time.h"\n#include "gnss_sim/simulator.h"\n#include "output/device_marker.h"',
          )
          replace_once(
              "tests/integration/test_scenarios.cpp",
              '''    EXPECT_EQ(occurrence_count(read_file(test_output_path("ks")), "#BESTPOSA,"), 50U);\n    EXPECT_EQ(summary.power_on_events, 1U);''',
              '''    const std::string log = read_file(test_output_path("ks"));\n    EXPECT_EQ(occurrence_count(log, "#BESTPOSA,"), 50U);\n    EXPECT_EQ(occurrence_count(log, gnss_sim::simulator_device_marker()), 0U);\n    EXPECT_EQ(summary.power_on_events, 1U);''',
          )
          replace_once(
              "tests/integration/test_scenarios.cpp",
              '''    EXPECT_EQ(occurrence_count(read_file(test_output_path("rea")), "#BESTPOSA,"), 60U);\n    EXPECT_EQ(summary.power_off_events, 0U);''',
              '''    const std::string log = read_file(test_output_path("rea"));\n    EXPECT_EQ(occurrence_count(log, "#BESTPOSA,"), 60U);\n    EXPECT_EQ(occurrence_count(log, gnss_sim::simulator_device_marker()), 0U);\n    EXPECT_EQ(summary.power_off_events, 0U);''',
          )
          replace_once(
              "tests/integration/test_scenarios.cpp",
              '''    EXPECT_EQ(summary.bestpos_messages, 60U);\n    EXPECT_EQ(occurrence_count(read_file(test_output_path(name)), "#BESTPOSA,"), 60U);\n    EXPECT_EQ(summary.power_on_events, 2U);\n    EXPECT_EQ(summary.power_off_events, 2U);''',
              '''    EXPECT_EQ(summary.bestpos_messages, 60U);\n    const std::string log = read_file(test_output_path(name));\n    EXPECT_EQ(occurrence_count(log, "#BESTPOSA,"), 60U);\n    EXPECT_EQ(summary.power_on_events, 2U);\n    EXPECT_EQ(summary.power_off_events, 2U);\n    const std::string& marker = gnss_sim::simulator_device_marker();\n    EXPECT_EQ(occurrence_count(log, marker), summary.power_on_events);\n    std::size_t marker_position = 0;\n    for (std::uint64_t index = 0; index < summary.power_on_events; ++index) {\n        marker_position = log.find(marker, marker_position);\n        ASSERT_NE(marker_position, std::string::npos);\n        const std::size_t next_record = marker_position + marker.size();\n        ASSERT_LT(next_record, log.size());\n        EXPECT_EQ(log[next_record], '#');\n        marker_position = next_record;\n    }''',
          )
          PY

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Commit tested patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/issue56-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/simulator.cpp src/output/device_marker.h tests/unit/test_output_writers.cpp tests/integration/test_scenarios.cpp .github/workflows/issue56-apply.yml
          git commit -m "fix: emit TTFF device markers on power-on"
          git push origin HEAD:issue-56-ttff-device-markers
