name: tmp-issue81-fix

on:
  push:
    branches:
      - issue-81-serialized-nav-roundtrip

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue81-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-81-serialized-nav-roundtrip
      - name: Apply scoped fixes
        shell: python
        run: |
          from pathlib import Path

          test = Path('tests/integration/test_rangea_roundtrip.cpp')
          text = test.read_text()
          anchor = '#include <filesystem>\n'
          assert anchor in text
          if '#include <cmath>\n' not in text:
              text = text.replace(anchor, '#include <cmath>\n' + anchor, 1)
          test.write_text(text)

          parser = Path('tools/rangea_roundtrip/serialized_nav_parser.cpp')
          text = parser.read_text()
          old = '    eph.transmit_week = week_near_sow(eph.toe_week, eph.toe_sow_sec, eph.transmit_sow_sec);\n'
          new = ('    // The ASCII body carries transmit SOW but not its week. Anchor the week to the log header\n'
                 '    // (the receiver delivery time), not Toe, so week-boundary delivery remains causal.\n'
                 '    eph.transmit_week = week_near_sow(output_week, output_sow, eph.transmit_sow_sec);\n')
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('    static_cast<void>(output_week);\n    static_cast<void>(output_sow);\n    record->kind = RtklibNavRecordKind::kEphemeris;\n',
                              '    record->kind = RtklibNavRecordKind::kEphemeris;\n', 1)
          parser.write_text(text)
      - name: Format
        run: clang-format -i tests/integration/test_rangea_roundtrip.cpp tools/rangea_roundtrip/serialized_nav_parser.cpp
      - name: Commit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/test_rangea_roundtrip.cpp tools/rangea_roundtrip/serialized_nav_parser.cpp
          git commit -m "Fix serialized NAV regression build and week inference [issue81-fix]"
          git push origin HEAD:issue-81-serialized-nav-roundtrip
