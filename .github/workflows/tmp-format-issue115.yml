name: tmp-format-issue115

on:
  push:
    branches:
      - issue-115-urban-scene-geometry

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-115-urban-scene-geometry
      - name: Apply repository clang-format
        shell: bash
        run: |
          set -euo pipefail
          clang-format -i src/model/urban_scene_geometry.cpp tests/unit/test_urban_scene_geometry.cpp
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/model/urban_scene_geometry.cpp tests/unit/test_urban_scene_geometry.cpp
          git commit -m "Apply clang-format to issue 115 geometry"
          git push origin HEAD:issue-115-urban-scene-geometry
