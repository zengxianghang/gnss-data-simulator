name: Diagnose issue 51 Galileo HAS E6 coverage

on:
  push:
    branches: [issue-51-all-signal-residuals]
    paths:
      - .github/workflows/apply-issue51-has-e6-pipeline.yml

permissions:
  contents: write

jobs:
  windows-default-stack:
    runs-on: windows-latest
    steps:
      - name: Checkout Draft branch with dependencies
        uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          submodules: recursive

      - name: Move the large RTKLIB nav oracle off the test stack
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/integration/test_all_signal_residuals.cpp')
          text = path.read_text()
          start = text.index('TEST(V1Acceptance, EveryFrozenSignalRunsTruthStateCodeAndDopplerResidualChecks)')
          end = text.index('\n}\n\n} // namespace', start)
          body = text[start:end]
          if body.count('nav_t nav{};') != 1:
              raise SystemExit('expected exactly one stack nav_t in residual acceptance')
          body = body.replace('nav_t nav{};', 'auto nav = std::make_unique<nav_t>();', 1)
          body = body.replace('&nav', 'nav.get()')
          body = body.replace('nav.n', 'nav->n')
          body = body.replace('nav.eph', 'nav->eph')
          text = text[:start] + body + text[end:]
          path.write_text(text)

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify default stack remains 1 MiB
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          dumpbin /headers build\Release\gnss_sim_integration_tests.exe | findstr /i "stack"

      - name: Run residual acceptance on default stack
        run: .\build\Release\gnss_sim_integration_tests.exe --gtest_filter=V1Acceptance.EveryFrozenSignalRunsTruthStateCodeAndDopplerResidualChecks

      - name: Run full Windows suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Commit heap-backed nav after validation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          clang-format -i tests/integration/test_all_signal_residuals.cpp
          git diff --check
          git add tests/integration/test_all_signal_residuals.cpp
          git commit -m "Fix Windows residual acceptance stack usage"
          git push origin HEAD:issue-51-all-signal-residuals
