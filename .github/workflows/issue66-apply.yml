name: issue66-apply

on:
  push:
    branches:
      - issue-66-real-glonass-l3oc

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Remove synthetic GLONASS L3OC residual overlay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-66-real-glonass-l3oc
      - name: Remove synthetic L3OC overlay and document unavailable real coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('tests/integration/test_all_signal_residuals.cpp')
          text = test_path.read_text()

          for block in [
              'extern "C" {\n#include <rtklib.h>\n}\n\n',
              '#include <fstream>\n',
              '#include <iomanip>\n',
              '#include <sstream>\n',
              '#include <vector>\n',
          ]:
              if block not in text:
                  raise SystemExit(f'missing expected block: {block!r}')
              text = text.replace(block, '', 1)

          start = text.index('double rinex4_field(')
          end = text.index('void configure_zero_noise_ks', start)
          text = text[:start] + text[end:]

          old_overlay = '''    std::string overlay_nav_path;\n    ASSERT_TRUE(write_g3_overlay_nav(directory, &overlay_nav_path));\n\n'''
          if old_overlay not in text:
              raise SystemExit('missing overlay setup')
          text = text.replace(old_overlay, '', 1)

          old_call = '''        ASSERT_TRUE(run_and_validate(directory / site.name, config, start, overlay_nav_path,\n                                     gnss_sim::residual_validator::AtmosphereMode::kBroadcast, &report, &error_message))\n'''
          new_call = '''        const std::string nav_path = brd4_nav_path();\n        ASSERT_TRUE(run_and_validate(directory / site.name, config, start, nav_path,\n                                     gnss_sim::residual_validator::AtmosphereMode::kBroadcast, &report, &error_message))\n'''
          if old_call not in text:
              raise SystemExit('missing overlay run_and_validate call')
          text = text.replace(old_call, new_call, 1)

          old_branch = '''        } else {\n            EXPECT_GT(stats.code_residuals, 0U)\n                << "compact coverage union must exercise code residual: " << definition.name;\n        }\n'''
          new_branch = '''        } else if (definition.signal_id == gnss_sim::SignalId::kGlonassG3) {\n            EXPECT_EQ(stats.code_residuals, 0U)\n                << "G3 code residual must stay unavailable until an authoritative real L3OC NAV record is present";\n            EXPECT_GT(stats.code_unavailable, 0U)\n                << "G3 must expose missing real L3OC code-bias coverage instead of synthesizing ephemeris";\n        } else {\n            EXPECT_GT(stats.code_residuals, 0U)\n                << "compact coverage union must exercise code residual: " << definition.name;\n        }\n'''
          if old_branch not in text:
              raise SystemExit('missing signal coverage branch')
          text = text.replace(old_branch, new_branch, 1)

          old_count = '    EXPECT_EQ(code_covered_signal_count, definition_count);\n'
          new_count = '''    // The authoritative BRD400DLR samples checked for Issue #66 contain no\n    // GLONASS L3OC EPH record. G3 therefore contributes explicit\n    // code_unavailable evidence while all 21 frequencies retain Doppler\n    // residual coverage. Never synthesize an L3OC record to make this 21/21.\n    EXPECT_EQ(code_covered_signal_count + 1U, definition_count);\n'''
          if old_count not in text:
              raise SystemExit('missing code coverage count assertion')
          text = text.replace(old_count, new_count, 1)

          test_path.write_text(text)

          readme_path = Path('tests/data/minimal/README.md')
          readme = readme_path.read_text()
          marker = '## GLONASS L3OC real-NAV availability\n'
          if marker not in readme:
              readme += '''\n## GLONASS L3OC real-NAV availability\n\nIssue #66 removed the former compact-test-only synthetic GLONASS L3OC overlay.\nThe test suite must not manufacture L3OC ephemeris or ISC values.\n\nOn 2026-08-29, the following authoritative DLR BRD400DLR products were downloaded\nfrom the BKG IGS BRDC archive and scanned for records matching\n`> EPH Rxx L3OC`. All files identified themselves as RINEX 4.02 and contained\nzero L3OC records:\n\n| Product day | gzip SHA256 | uncompressed RINEX SHA256 | L3OC records |\n| --- | --- | --- | ---: |\n| 2025-003 | `467f35074eb0f948df8d814ea460be8ede8daa521148d21e14be787c0c057ff0` | `ffef82cce9e3c75dbb693f8aaee67da1c5742f9f2bfeb3f723cff67dda3b32d7` | 0 |\n| 2025-100 | `41ceaf963eea65f9f715d97fc86e74a099948146b82fbc185ba727242ae9fd65` | `fdb720e57a865b79a071a43c3de5cbe8fcdbb3ab4fecb8530ede7cffb2618024` | 0 |\n| 2025-200 | `cc719286f5e414125c61f7d5189923e539fb32ac9252e34d4e44bb88b4f9843d` | `e2489163840c20f5a2497d444b6833780d36ae07b0d64973e1d662861e483a0c` | 0 |\n| 2025-300 | `8f8d2f57b380f7a7bd1366f2fb44b17a30e7df47269a79e926aac17334654665` | `ae5bcff125521b0efeb76e450f915605d9c540c4c53fe4b48d6256cf6e6de2d5` | 0 |\n| 2026-001 | `ff11082ccb87c8c678f9aa258487ec5d8e838e330f1c5e92ce289134ef15f805` | `72c0eaeb28e597244077872105c5b49372a38d1f2589de151d79f10015fdca9f` | 0 |\n| 2026-100 | `14500ce323bc7b13541fa17eb04e483879ab25159c84ee264fa5b2ac7ea32dbd` | `8b21fb009fd11d25fc5ef12839d44020da76a23a59518477721b3e72cc86d407` | 0 |\n| 2026-200 | `1bca00e827e2ed812c9fb1ad27a622b045e29f2c53374c5dfa1a0e4d5ca50f26` | `ad4820c951c89b149a0df7fd3010e6f020e0c8192b1b507f5dcfcd880b0a10cc` | 0 |\n\nArchive pattern:\n`https://igs.bkg.bund.de/root_ftp/IGS/BRDC/YYYY/DDD/BRD400DLR_S_YYYYDDD0000_01D_MN.rnx.gz`\n\nUntil a provenance-traceable authoritative L3OC record is available, compact CI\nkeeps GLONASS G3 observation/Doppler validation but requires its code-bias\ncoverage to be reported explicitly as unavailable. A synthetic fallback is forbidden.\n'''
              readme_path.write_text(readme)
          PY

          clang-format -i tests/integration/test_all_signal_residuals.cpp
          git diff --check
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/test_all_signal_residuals.cpp tests/data/minimal/README.md
          git commit -m 'Remove synthetic GLONASS L3OC residual overlay'
          git push origin HEAD:issue-66-real-glonass-l3oc
