name: Materialize JRC HAS E6 fixture

on:
  push:
    branches: [issue-51-all-signal-residuals]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Draft branch
        uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          fetch-depth: 0

      - name: Download official JRC HAS products
        shell: bash
        run: |
          set -euo pipefail
          base='https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GALILEO-HAS/PRODUCTS/daily/2026/001'
          mkdir -p /tmp/jrc_has
          curl -fsSL --retry 3 "$base/SSRC00JRC0_20260010000_01D_50S_BIA.BIA.gz" -o /tmp/jrc_has/has.bia.gz
          curl -fsSL --retry 3 "$base/SSRC00JRC0_20260010000_01D_10S_CLK.CLK.gz" -o /tmp/jrc_has/has.clk.gz
          curl -fsSL --retry 3 "$base/SSRC00JRC0_20260010000_01D_50S_ORB.SP3.gz" -o /tmp/jrc_has/has.sp3.gz
          gzip -dc /tmp/jrc_has/has.bia.gz > /tmp/jrc_has/has.bia
          gzip -dc /tmp/jrc_has/has.clk.gz > /tmp/jrc_has/has.clk
          gzip -dc /tmp/jrc_has/has.sp3.gz > /tmp/jrc_has/has.sp3

      - name: Extract provenance-preserving E02 ten-minute fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def lines_without_eol_padding(path):
              # RINEX/SP3 source files use fixed-width trailing padding. Removing
              # only whitespace after the final field preserves every field
              # start column and numeric token while keeping git diff --check clean.
              return [line.rstrip() for line in Path(path).read_text().splitlines()]

          out = Path('tests/data/minimal')
          out.mkdir(parents=True, exist_ok=True)

          bia_lines = lines_without_eol_padding('/tmp/jrc_has/has.bia')
          time_system = next(line for line in bia_lines if 'TIME_SYSTEM' in line)
          osb_rows = []
          for line in bia_lines:
              parts = line.split()
              if len(parts) < 7 or parts[0] != 'OSB' or parts[1] != 'E02' or parts[2] != 'C6C':
                  continue
              m = re.fullmatch(r'2026:001:(\d{5})', parts[3])
              if m and 180 <= int(m.group(1)) <= 780:
                  osb_rows.append(line)
          if len(osb_rows) < 10:
              raise RuntimeError(f'expected >=10 E02 C6C OSB rows, got {len(osb_rows)}')
          bia_out = [
              '%=BIA 1.00 JRC 2026:001:00780 JRC 2026:001:00180 2026:001:00780 A 00000001',
              '* Numeric/source rows extracted from SSRC00JRC0_20260010000_01D_50S_BIA.BIA; trailing padding removed',
              '+FILE/REFERENCE',
              ' INPUT             HAS corrections',
              '-FILE/REFERENCE',
              '+BIAS/DESCRIPTION',
              time_system,
              ' DESCRIPTION        GALILEO C6C',
              '-BIAS/DESCRIPTION',
              '+BIAS/SOLUTION',
              '*BIAS SVN_ PRN STATION__ OBS1 OBS2 BIAS_START____ BIAS_END______ UNIT __ESTIMATED_VALUE____',
              *osb_rows,
              '-BIAS/SOLUTION',
              '%ENDSNX',
          ]
          (out / 'jrc_has_2026001_e02_c6c.bia').write_text('\n'.join(bia_out) + '\n')

          clk_lines = lines_without_eol_padding('/tmp/jrc_has/has.clk')
          end_header = next(i for i, line in enumerate(clk_lines) if 'END OF HEADER' in line)
          clk_rows = []
          for line in clk_lines[end_header + 1:]:
              if not line.startswith('AS E02'):
                  continue
              parts = line.split()
              if len(parts) < 9:
                  continue
              hour, minute, second = int(parts[5]), int(parts[6]), float(parts[7])
              sod = hour * 3600 + minute * 60 + second
              if 120.0 <= sod <= 840.0:
                  clk_rows.append(line)
          if len(clk_rows) < 60:
              raise RuntimeError(f'expected >=60 E02 clock rows, got {len(clk_rows)}')
          (out / 'jrc_has_2026001_e02.clk').write_text('\n'.join(clk_lines[:end_header + 1] + clk_rows) + '\n')

          sp3_lines = lines_without_eol_padding('/tmp/jrc_has/has.sp3')
          first_epoch = next(i for i, line in enumerate(sp3_lines) if line.startswith('*'))
          sp3_out = list(sp3_lines[:first_epoch])
          kept = 0
          i = first_epoch
          while i < len(sp3_lines):
              line = sp3_lines[i]
              if not line.startswith('*'):
                  i += 1
                  continue
              parts = line.split()
              if len(parts) < 7:
                  i += 1
                  continue
              hour, minute, second = int(parts[4]), int(parts[5]), float(parts[6])
              sod = hour * 3600 + minute * 60 + second
              epoch_line = line
              i += 1
              e02 = None
              while i < len(sp3_lines) and not sp3_lines[i].startswith('*') and sp3_lines[i] != 'EOF':
                  if sp3_lines[i].startswith('PE02'):
                      e02 = sp3_lines[i]
                  i += 1
              if 100.0 <= sod <= 850.0 and e02 is not None:
                  sp3_out.extend([epoch_line, e02])
                  kept += 1
              if i < len(sp3_lines) and sp3_lines[i] == 'EOF':
                  break
          if kept < 15:
              raise RuntimeError(f'expected >=15 E02 SP3 epochs, got {kept}')
          sp3_out.append('EOF')
          (out / 'jrc_has_2026001_e02.sp3').write_text('\n'.join(sp3_out) + '\n')

          print(f'fixture: osb={len(osb_rows)} clk={len(clk_rows)} sp3={kept}')
          PY
          grep -m 3 ' E02.*C6C' tests/data/minimal/jrc_has_2026001_e02_c6c.bia
          grep -m 2 '^AS E02' tests/data/minimal/jrc_has_2026001_e02.clk
          grep -m 2 '^PE02' tests/data/minimal/jrc_has_2026001_e02.sp3

      - name: Commit fixture only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/data/minimal/jrc_has_2026001_e02.sp3 \
                  tests/data/minimal/jrc_has_2026001_e02.clk \
                  tests/data/minimal/jrc_has_2026001_e02_c6c.bia
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'fixture already materialized'
            exit 0
          fi
          git commit -m 'testdata: add official JRC HAS E6 fixture'
          git push origin HEAD:issue-51-all-signal-residuals
