name: issue162-bootstrap

on:
  push:
    branches:
      - issue-162-carrier-tracking-truth

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: issue-162-carrier-tracking-truth
          fetch-depth: 0
      - name: Apply runtime wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "CMakeLists.txt",
              "    src/output/novatel_solution_writer.cpp\n    src/output/truth_writer.cpp\n    src/output/urban_truth_writer.cpp\n",
              "    src/output/novatel_solution_writer.cpp\n    src/output/carrier_tracking_truth_writer.cpp\n"
              "    src/output/truth_writer.cpp\n    src/output/urban_truth_writer.cpp\n",
          )
          replace_once(
              "CMakeLists.txt",
              "        tests/integration/test_all_signal_residuals.cpp\n        tests/integration/test_carrier_tracking_runtime.cpp\n",
              "        tests/integration/test_all_signal_residuals.cpp\n        tests/integration/test_carrier_tracking_runtime.cpp\n"
              "        tests/integration/test_carrier_tracking_truth.cpp\n",
          )

          replace_once(
              "src/core/simulator.cpp",
              '#include "output/device_marker.h"\n',
              '#include "output/carrier_tracking_truth_writer.h"\n#include "output/device_marker.h"\n',
          )
          replace_once(
              "src/core/simulator.cpp",
              "bool update_tracking_and_measurements(RuntimeState* runtime, const SimConfig& config,\n"
              "                                      const ScenarioEpochState& scenario,\n"
              "                                      std::vector<MeasurementObservation>* measurements, int* tracked_satellites,\n"
              "                                      TruthWriter* truth_writer, UrbanTruthWriter* urban_truth_writer,\n"
              "                                      std::string* error_message) {",
              "bool update_tracking_and_measurements(RuntimeState* runtime, const SimConfig& config,\n"
              "                                      const ScenarioEpochState& scenario,\n"
              "                                      std::vector<MeasurementObservation>* measurements, int* tracked_satellites,\n"
              "                                      TruthWriter* truth_writer, UrbanTruthWriter* urban_truth_writer,\n"
              "                                      CarrierTrackingTruthWriter* carrier_truth_writer,\n"
              "                                      std::string* error_message) {",
          )

          old_nontracking = '''            if (signal.tracker.phase != SignalTrackingPhase::kTracking) {
                if (config.multipath_enabled &&
                    !urban_truth_writer_write_signal(urban_truth_writer, signal_geometry, *definition, glonass_fcn,
                                                     urban_epoch, urban_temporal, nullptr, error_message)) {
                    return false;
                }
                reset_carrier_ambiguity_state(&signal.ambiguity);
                reset_measurement_error_state(&signal.measurement_error);
                reset_carrier_tracking_runtime_state(&signal.carrier_tracking);
                continue;
            }
'''
          new_nontracking = '''            if (signal.tracker.phase != SignalTrackingPhase::kTracking) {
                CarrierTrackingTruthSnapshot carrier_truth{};
                carrier_truth.carrier_tracking_enabled = config.carrier_tracking.enabled;
                carrier_truth.reset_reason = CarrierTrackingTruthResetReason::kCodeNotTracking;
                carrier_truth.coherent_integration_sec = config.carrier_tracking.coherent_integration_sec;
                carrier_truth.environmental_range_rate_applicable = config.multipath_enabled;
                carrier_truth.environmental_range_rate_valid =
                    config.multipath_enabled && urban_temporal.environmental_range_rate_valid;
                carrier_truth.environmental_range_rate_mps = urban_temporal.environmental_range_rate_mps;
                if (!carrier_tracking_truth_writer_write_signal(carrier_truth_writer, signal_geometry, *definition,
                                                                glonass_fcn, signal.tracker, carrier_truth,
                                                                error_message) ||
                    (config.multipath_enabled &&
                     !urban_truth_writer_write_signal(urban_truth_writer, signal_geometry, *definition, glonass_fcn,
                                                      urban_epoch, urban_temporal, nullptr, error_message))) {
                    return false;
                }
                reset_carrier_ambiguity_state(&signal.ambiguity);
                reset_measurement_error_state(&signal.measurement_error);
                reset_carrier_tracking_runtime_state(&signal.carrier_tracking);
                continue;
            }
'''
          replace_once("src/core/simulator.cpp", old_nontracking, new_nontracking)

          old_carrier = '''            CarrierTrackingRuntimeResult carrier_result{};
            if (config.carrier_tracking.enabled) {
                double wavelength_m = 0.0;
                if (!signal_wavelength_m(*definition, glonass_fcn, &wavelength_m)) {
                    set_error(error_message, "cannot determine carrier tracking signal wavelength");
                    return false;
                }
                const double carrier_cn0_dbhz =
                    config.multipath_enabled ? urban_epoch.effective_cn0_dbhz : signal.tracker.cn0_dbhz;
                if (!update_carrier_tracking_runtime(config.carrier_tracking, scenario.time, true, carrier_cn0_dbhz,
                                                     wavelength_m, &signal.carrier_tracking, &carrier_result,
                                                     error_message)) {
                    return false;
                }
            }
'''
          new_carrier = '''            CarrierTrackingTruthSnapshot carrier_truth{};
            carrier_truth.carrier_tracking_enabled = config.carrier_tracking.enabled;
            carrier_truth.reset_reason = config.carrier_tracking.enabled
                                             ? CarrierTrackingTruthResetReason::kNone
                                             : CarrierTrackingTruthResetReason::kFeatureDisabled;
            carrier_truth.coherent_integration_sec = config.carrier_tracking.coherent_integration_sec;
            carrier_truth.environmental_range_rate_applicable = config.multipath_enabled;
            carrier_truth.environmental_range_rate_valid =
                config.multipath_enabled && urban_temporal.environmental_range_rate_valid;
            carrier_truth.environmental_range_rate_mps = urban_temporal.environmental_range_rate_mps;

            CarrierTrackingRuntimeResult carrier_result{};
            if (config.carrier_tracking.enabled) {
                double wavelength_m = 0.0;
                if (!signal_wavelength_m(*definition, glonass_fcn, &wavelength_m)) {
                    set_error(error_message, "cannot determine carrier tracking signal wavelength");
                    return false;
                }
                const double carrier_cn0_dbhz =
                    config.multipath_enabled ? urban_epoch.effective_cn0_dbhz : signal.tracker.cn0_dbhz;
                if (!update_carrier_tracking_runtime(config.carrier_tracking, scenario.time, true, carrier_cn0_dbhz,
                                                     wavelength_m, &signal.carrier_tracking, &carrier_result,
                                                     error_message)) {
                    return false;
                }
                carrier_truth.result_available = true;
                carrier_truth.effective_cn0_dbhz = carrier_cn0_dbhz;
                carrier_truth.runtime_result = carrier_result;
                carrier_truth.runtime_state = signal.carrier_tracking.tracking;
            }
'''
          replace_once("src/core/simulator.cpp", old_carrier, new_carrier)

          old_boundary = '''            if ((config.multipath_enabled &&
                 !urban_truth_writer_write_signal(urban_truth_writer, signal_geometry, *definition, glonass_fcn,
                                                  urban_epoch, urban_temporal, &observation, error_message)) ||
                !truth_writer_write_observation(truth_writer, runtime->receiver, signal_geometry, signal.tracker,
                                                observation, error_message)) {
                return false;
            }
            MeasurementObservation reported_observation = observation;
            if (config.carrier_tracking.enabled &&
                !apply_carrier_tracking_runtime_result(carrier_result, &reported_observation, error_message)) {
                return false;
            }
            if (config.measurement_noise_enabled) {
'''
          new_boundary = '''            carrier_truth.physical_snapshot_available = true;
            carrier_truth.physical_observation = observation;
            carrier_truth.physical_range_rate_valid = observation.doppler_valid;
            if ((config.multipath_enabled &&
                 !urban_truth_writer_write_signal(urban_truth_writer, signal_geometry, *definition, glonass_fcn,
                                                  urban_epoch, urban_temporal, &observation, error_message)) ||
                !truth_writer_write_observation(truth_writer, runtime->receiver, signal_geometry, signal.tracker,
                                                observation, error_message)) {
                return false;
            }
            MeasurementObservation reported_observation = observation;
            if (config.carrier_tracking.enabled &&
                !apply_carrier_tracking_runtime_result(carrier_result, &reported_observation, error_message)) {
                return false;
            }
            carrier_truth.post_carrier_snapshot_available = true;
            carrier_truth.post_carrier_observation = reported_observation;
            carrier_truth.post_carrier_range_rate_valid = reported_observation.doppler_valid;
            if (!carrier_tracking_truth_writer_write_signal(carrier_truth_writer, signal_geometry, *definition,
                                                            glonass_fcn, signal.tracker, carrier_truth,
                                                            error_message)) {
                return false;
            }
            if (config.measurement_noise_enabled) {
'''
          replace_once("src/core/simulator.cpp", old_boundary, new_boundary)

          old_create = '''    UrbanTruthWriter* urban_truth_writer = create_urban_truth_writer(options.output_log_path, error_message);
    if (urban_truth_writer == nullptr) {
        destroy_truth_writer(truth_writer);
        output.close();
        destroy_navigation_state(runtime.navigation);
        return false;
    }
'''
          new_create = '''    CarrierTrackingTruthWriter* carrier_truth_writer =
        create_carrier_tracking_truth_writer(options.output_log_path, error_message);
    if (carrier_truth_writer == nullptr) {
        destroy_truth_writer(truth_writer);
        output.close();
        destroy_navigation_state(runtime.navigation);
        return false;
    }
    UrbanTruthWriter* urban_truth_writer = create_urban_truth_writer(options.output_log_path, error_message);
    if (urban_truth_writer == nullptr) {
        destroy_carrier_tracking_truth_writer(carrier_truth_writer);
        destroy_truth_writer(truth_writer);
        output.close();
        destroy_navigation_state(runtime.navigation);
        return false;
    }
'''
          replace_once("src/core/simulator.cpp", old_create, new_create)

          old_epoch_fail = '''        destroy_urban_truth_writer(urban_truth_writer);
        destroy_truth_writer(truth_writer);
        destroy_navigation_state(runtime.navigation);
        return false;
    }
    result.scheduled_epochs = epoch_count;
'''
          new_epoch_fail = '''        destroy_urban_truth_writer(urban_truth_writer);
        destroy_carrier_tracking_truth_writer(carrier_truth_writer);
        destroy_truth_writer(truth_writer);
        destroy_navigation_state(runtime.navigation);
        return false;
    }
    result.scheduled_epochs = epoch_count;
'''
          replace_once("src/core/simulator.cpp", old_epoch_fail, new_epoch_fail)

          replace_once(
              "src/core/simulator.cpp",
              '''        if (!update_tracking_and_measurements(&runtime, config, scenario, &measurements, &tracked_satellites,
                                              truth_writer, urban_truth_writer, error_message) ||
''',
              '''        if (!update_tracking_and_measurements(&runtime, config, scenario, &measurements, &tracked_satellites,
                                              truth_writer, urban_truth_writer, carrier_truth_writer, error_message) ||
''',
          )

          old_finalize = '''    if (ok && !finalize_urban_truth_writer(urban_truth_writer, error_message)) {
        ok = false;
    }
    if (ok && !finalize_truth_writer(truth_writer, result, simulator_version(), simulator_commit_sha(),
                                     rtklib_commit_sha(), error_message)) {
        ok = false;
    }
    destroy_urban_truth_writer(urban_truth_writer);
    destroy_truth_writer(truth_writer);
'''
          new_finalize = '''    if (ok && !finalize_carrier_tracking_truth_writer(carrier_truth_writer, error_message)) {
        ok = false;
    }
    if (ok && !finalize_urban_truth_writer(urban_truth_writer, error_message)) {
        ok = false;
    }
    if (ok && !finalize_truth_writer(truth_writer, result, simulator_version(), simulator_commit_sha(),
                                     rtklib_commit_sha(), error_message)) {
        ok = false;
    }
    destroy_urban_truth_writer(urban_truth_writer);
    destroy_carrier_tracking_truth_writer(carrier_truth_writer);
    destroy_truth_writer(truth_writer);
'''
          replace_once("src/core/simulator.cpp", old_finalize, new_finalize)
          PY
      - name: Fix known CSV empty-field count
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/output/carrier_tracking_truth_writer.cpp")
          text = path.read_text()
          old = '        output << ",,,,,,,,,";\n'
          new = '        output << ",,,,,,,,";\n'
          if text.count(old) != 1:
              raise SystemExit("carrier truth unavailable-observation delimiter pattern changed")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed C++
        shell: bash
        run: |
          clang-format -i \
            src/core/simulator.cpp \
            src/output/carrier_tracking_truth_writer.h \
            src/output/carrier_tracking_truth_writer.cpp \
            tests/integration/test_carrier_tracking_truth.cpp
      - name: Commit implementation and remove bootstrap workflow
        shell: bash
        run: |
          git rm .github/workflows/issue162-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/core/simulator.cpp src/output/carrier_tracking_truth_writer.h \
            src/output/carrier_tracking_truth_writer.cpp tests/integration/test_carrier_tracking_truth.cpp \
            docs/CARRIER_TRACKING_TRUTH.md
          git commit -m "Add exact carrier tracking truth diagnostics"
          git push origin HEAD:refs/heads/issue-162-carrier-tracking-truth
