name: apply-issue-112

on:
  push:
    branches:
      - issue-112-cn0-metadata-constellation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-112-cn0-metadata-constellation
      - name: Apply focused metadata identity patch
        run: |
          python3 .github/scripts/apply_issue112.py
          clang-format -i tools/build_cn0_model/cn0_normalized_builder.cpp tests/unit/test_cn0_normalized_builder.cpp
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_cn0_model/cn0_normalized_builder.cpp tests/unit/test_cn0_normalized_builder.cpp
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "fix: preserve constellation in normalized CN0 metadata"
          git push origin HEAD:issue-112-cn0-metadata-constellation
