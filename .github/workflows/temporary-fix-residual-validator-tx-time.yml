name: Temporary fix residual validator transmit time

on:
  push:
    branches:
      - issue-51-all-signal-residuals

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          fetch-depth: 0

      - name: Preserve raw pseudorange for Doppler transmit-time and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/residual_validator/residual_validator.cpp')
          text = path.read_text()
          old = '''            if (pseudorange_valid) {\n                observation.P[0] = std::stod(fields[columns.at("pseudorange_m")]);\n            }\n            if (doppler_valid) {\n'''
          new = '''            // RTKLIB's Doppler residual reconstructs transmit time from the raw pseudorange.\n            // Keep P[0] populated even when code validity is false; pseudorange_valid still\n            // controls whether a code residual is evaluated.\n            observation.P[0] = std::stod(fields[columns.at("pseudorange_m")]);\n            if (doppler_valid) {\n'''
          if old not in text:
              raise SystemExit('expected residual-validator pseudorange block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          clang-format -i tools/residual_validator/residual_validator.cpp
          rm .github/workflows/temporary-fix-residual-validator-tx-time.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve pseudorange for Doppler residual timing"
          git push origin HEAD:issue-51-all-signal-residuals
