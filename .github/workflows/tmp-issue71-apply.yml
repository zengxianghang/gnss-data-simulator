name: tmp-issue71-format

on:
  push:
    branches:
      - issue-71-measurement-error-core

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Format Issue 71 tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-71-measurement-error-core
      - name: Format changed C++
        run: |
          clang-format -i include/gnss_sim/sim_config.h src/core/sim_config.cpp src/model/measurement_error_model.h src/model/measurement_error_model.cpp tests/unit/test_measurement_error_model.cpp tests/unit/test_sim_config.cpp
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/gnss_sim/sim_config.h src/core/sim_config.cpp src/model/measurement_error_model.h src/model/measurement_error_model.cpp tests/unit/test_measurement_error_model.cpp tests/unit/test_sim_config.cpp
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format measurement error core"
          git push
