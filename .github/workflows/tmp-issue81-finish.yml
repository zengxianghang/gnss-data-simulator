name: tmp-issue81-finish

on:
  push:
    branches:
      - issue-81-serialized-nav-roundtrip

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue81-finish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-81-serialized-nav-roundtrip
      - name: Apply regression and format
        run: |
          python .github/issue81_bds_regression.py
          clang-format -i tests/integration/test_rangea_roundtrip.cpp src/output/novatel_nav_writer.cpp
      - name: Commit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/test_rangea_roundtrip.cpp src/output/novatel_nav_writer.cpp
          git commit -m "Add serialized BeiDou NAV state regression [issue81-finish]"
          git push origin HEAD:issue-81-serialized-nav-roundtrip
