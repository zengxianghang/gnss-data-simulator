name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check clang-format
        shell: bash
        run: |
          mapfile -t files < <(find include src tests tools -type f \( -name '*.h' -o -name '*.c' -o -name '*.cpp' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C/C++ files found"
            exit 1
          fi
          clang-format -i "${files[@]}"
          if ! git diff --exit-code -- "${files[@]}"; then
            echo "C/C++ formatting differs from .clang-format. Apply the diff above."
            exit 1
          fi

  tooling-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extended validation harness self-test
        run: python3 tools/extended_validation/run_extended.py --self-test

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout with RTKLIB
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Report RANGEA round-trip positioning error
        if: runner.os == 'Linux'
        shell: bash
        run: ./build/gnss_sim_integration_tests --gtest_filter=RangeaRoundtripIntegration.LowElevationRangeIsRetainedWhileSppUsesFiveDegreeMask
      - name: Report self-contained serialized NAV positioning error
        if: runner.os == 'Linux'
        shell: bash
        run: ./build/gnss_sim_integration_tests --gtest_filter=RangeaRoundtripIntegration.SerializedRangeAndEphemerisPositionWithoutOriginalRinexNavAndParsesIon
