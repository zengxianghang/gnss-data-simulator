name: tmp-issue81-final-fix

on:
  push:
    branches:
      - issue-81-serialized-nav-roundtrip

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue81-final-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-81-serialized-nav-roundtrip
      - run: python .github/issue81_final_fix.py
      - run: clang-format -i tools/rangea_roundtrip/serialized_nav_parser.cpp tests/integration/test_rangea_roundtrip.cpp
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/rangea_roundtrip/serialized_nav_parser.cpp tests/integration/test_rangea_roundtrip.cpp docs/SERIALIZED_NAV_ROUNDTRIP.md
          git commit -m "Align self-contained NAV validation with real ion availability [issue81-final-fix]"
          git push origin HEAD:issue-81-serialized-nav-roundtrip
