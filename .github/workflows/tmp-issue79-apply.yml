name: tmp-issue79-apply

on:
  push:
    branches:
      - issue-79-bestpos-mirror-psrpos

jobs:
  apply:
    if: github.event.head_commit.message == 'Add temporary issue 79 apply workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-79-bestpos-mirror-psrpos
          submodules: false
      - name: Apply issue 79 patch
        run: python3 .github/issue79_apply.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt config/default_v1.json include/gnss_sim/sim_config.h src/core/sim_config.cpp src/core/simulator.cpp src/model/bestpos_rtk_model.h src/model/bestpos_rtk_model.cpp src/output/novatel_solution_writer.h src/output/novatel_solution_writer.cpp src/output/truth_writer.cpp tests/unit/test_bestpos_rtk_model.cpp tests/unit/test_sim_config.cpp tests/unit/test_output_writers.cpp tests/integration/test_scenarios.cpp tests/integration/test_truth_outputs.cpp
          git commit -m "Implement deterministic BESTPOS RTK-fixed intervals"
          git push origin HEAD:issue-79-bestpos-mirror-psrpos
