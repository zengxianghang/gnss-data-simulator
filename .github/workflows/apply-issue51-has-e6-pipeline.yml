name: Diagnose issue 51 Galileo HAS E6 coverage

on:
  push:
    branches: [issue-51-all-signal-residuals]
    paths:
      - .github/workflows/apply-issue51-has-e6-pipeline.yml

permissions:
  contents: read

jobs:
  windows-stack-check:
    runs-on: windows-latest
    steps:
      - name: Checkout Draft branch with dependencies
        uses: actions/checkout@v4
        with:
          ref: issue-51-all-signal-residuals
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build integration tests
        run: cmake --build build --config Release --target gnss_sim_integration_tests --parallel

      - name: Show and enlarge test executable stack
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          dumpbin /headers build\Release\gnss_sim_integration_tests.exe | findstr /i "stack"
          editbin /STACK:8388608 build\Release\gnss_sim_integration_tests.exe
          dumpbin /headers build\Release\gnss_sim_integration_tests.exe | findstr /i "stack"

      - name: Run residual acceptance with 8 MiB stack
        run: .\build\Release\gnss_sim_integration_tests.exe --gtest_filter=V1Acceptance.EveryFrozenSignalRunsTruthStateCodeAndDopplerResidualChecks
