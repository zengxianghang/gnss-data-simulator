name: apply transmit-time ephemeris selection fix

on:
  push:
    branches:
      - fix/transmit-time-ephemeris-selection
    paths:
      - .github/workflows/tmp-apply-transmit-fix.yml
      - .github/scripts/apply_transmit_fix.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_transmit_fix.py
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit tested fix
        run: |
          rm .github/workflows/tmp-apply-transmit-fix.yml
          rm .github/scripts/apply_transmit_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix transmit-time ephemeris selection stability"
          git push origin HEAD:fix/transmit-time-ephemeris-selection
