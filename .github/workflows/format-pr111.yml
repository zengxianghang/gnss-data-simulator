name: format-pr111

on:
  push:
    branches:
      - issue-107-cn0-runtime-composition

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-107-cn0-runtime-composition
      - name: Apply repository clang-format
        shell: bash
        run: |
          mapfile -t files < <(find include src tests tools -type f \( -name '*.h' -o -name '*.c' -o -name '*.cpp' \) | sort)
          clang-format -i "${files[@]}"
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include src tests tools
          git commit -m "style: apply clang-format for PR #111"
          git push origin HEAD:issue-107-cn0-runtime-composition
