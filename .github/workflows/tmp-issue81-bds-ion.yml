name: tmp-issue81-bds-ion

on:
  push:
    branches:
      - issue-81-serialized-nav-roundtrip

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue81-nav-meta]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-81-serialized-nav-roundtrip
      - name: Apply NAV metadata fix
        run: python .github/issue81_nav_meta.py
      - name: Format
        run: clang-format -i tools/rangea_roundtrip/serialized_nav_parser.cpp tools/rangea_roundtrip/rangea_roundtrip.cpp tools/rangea_roundtrip/rangea_roundtrip.h tests/integration/test_rangea_roundtrip.cpp
      - name: Commit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/rangea_roundtrip/serialized_nav_parser.cpp tools/rangea_roundtrip/rangea_roundtrip.cpp tools/rangea_roundtrip/rangea_roundtrip.h tests/integration/test_rangea_roundtrip.cpp docs/SERIALIZED_NAV_ROUNDTRIP.md
          git commit -m "Preserve serialized ION timing metadata [issue81-nav-meta]"
          git push origin HEAD:issue-81-serialized-nav-roundtrip
