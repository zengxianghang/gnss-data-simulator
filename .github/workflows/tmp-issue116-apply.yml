name: tmp-issue116-apply

on:
  push:
    branches:
      - issue-116-low-e-rf-model

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-116-low-e-rf-model
      - name: Apply issue 116 implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f src/model/urban_rf_model.cpp ]; then
            echo "Issue 116 implementation already present"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:80]!r}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          Path('src/model/urban_rf_model.h').write_text(r'''#ifndef GNSS_SIM_SRC_MODEL_URBAN_RF_MODEL_H_
          #define GNSS_SIM_SRC_MODEL_URBAN_RF_MODEL_H_

          #include "gnss/signal_definitions.h"
          #include "gnss_sim/sim_config.h"

          #include <complex>
          #include <string>

          namespace gnss_sim {

          enum class UrbanCircularPolarization {
              kRhcp,
              kLhcp,
          };

          struct UrbanRfResolvedConfig {
              UrbanRfMaterialConfig material;
              UrbanRfAntennaConfig antenna;
          };

          struct UrbanRfReflectionResponse {
              double glass_conductivity_s_per_m;
              std::complex<double> glass_relative_permittivity;
              std::complex<double> gamma_te_tangent;
              std::complex<double> gamma_tm_tangent;
              std::complex<double> gamma_rhcp_from_rhcp;
              std::complex<double> gamma_lhcp_from_rhcp;
          };

          bool validate_urban_rf_material_config(const UrbanRfMaterialConfig& config, std::string* error_message);
          bool validate_urban_rf_antenna_config(const UrbanRfAntennaConfig& config, std::string* error_message);
          bool resolve_urban_rf_signal_config(const UrbanRfConfig& config, const SignalDefinition& signal,
                                              UrbanRfResolvedConfig* resolved, std::string* error_message);
          bool compute_low_e_curtain_wall_reflection(const UrbanRfMaterialConfig& config, double frequency_hz,
                                                     double incidence_angle_rad, UrbanRfReflectionResponse* response,
                                                     std::string* error_message);
          bool evaluate_urban_antenna_response(const UrbanRfAntennaConfig& config, UrbanCircularPolarization polarization,
                                               double arrival_elevation_rad, std::complex<double>* voltage_response,
                                               std::string* error_message);
          bool compute_urban_reflected_port_factor(const UrbanRfReflectionResponse& reflection,
                                                   const UrbanRfAntennaConfig& antenna,
                                                   double arrival_elevation_rad,
                                                   std::complex<double>* port_factor,
                                                   std::string* error_message);

          } // namespace gnss_sim

          #endif // GNSS_SIM_SRC_MODEL_URBAN_RF_MODEL_H_
          ''')

          Path('src/model/urban_rf_model.cpp').write_text(r'''#include "model/urban_rf_model.h"

          #include <cmath>
          #include <complex>

          namespace gnss_sim {
          namespace {

          constexpr double kPi = 3.141592653589793238462643383279502884;
          constexpr double kSpeedOfLightMps = 299792458.0;
          constexpr double kVacuumPermittivityFpm = 8.8541878128e-12;
          constexpr double kFreeSpaceImpedanceOhm = 376.730313668;
          constexpr double kDegreesToRadians = kPi / 180.0;
          constexpr double kMinimumCosIncidence = 1.0e-12;

          enum class LinearPolarization {
              kTe,
              kTm,
          };

          struct Matrix2 {
              std::complex<double> a;
              std::complex<double> b;
              std::complex<double> c;
              std::complex<double> d;
          };

          void set_error(std::string* error_message, const char* message) {
              if (error_message != nullptr) {
                  *error_message = message;
              }
          }

          bool finite_complex(const std::complex<double>& value) {
              return std::isfinite(value.real()) && std::isfinite(value.imag());
          }

          bool finite_positive(double value) {
              return std::isfinite(value) && value > 0.0;
          }

          bool finite_nonnegative(double value) {
              return std::isfinite(value) && value >= 0.0;
          }

          bool validate_polarization_response(const UrbanRfPolarizationResponseConfig& config) {
              return std::isfinite(config.gain_db_horizon) && std::isfinite(config.gain_db_zenith) &&
                     std::isfinite(config.phase_deg_horizon) && std::isfinite(config.phase_deg_zenith);
          }

          Matrix2 multiply(const Matrix2& left, const Matrix2& right) {
              return {left.a * right.a + left.b * right.c, left.a * right.b + left.b * right.d,
                      left.c * right.a + left.d * right.c, left.c * right.b + left.d * right.d};
          }

          std::complex<double> passive_forward_root(const std::complex<double>& value) {
              std::complex<double> root = std::sqrt(value);
              if (root.real() < 0.0 || (std::fabs(root.real()) <= 1.0e-15 && root.imag() > 0.0)) {
                  root = -root;
              }
              return root;
          }

          bool layer_matrix(const std::complex<double>& relative_permittivity, double sin_incidence_squared,
                            double thickness_m, double k0_rad_per_m, LinearPolarization polarization, Matrix2* matrix) {
              if (matrix == nullptr) {
                  return false;
              }
              const std::complex<double> q =
                  passive_forward_root(relative_permittivity - std::complex<double>(sin_incidence_squared, 0.0));
              if (!finite_complex(q) || std::abs(q) <= 0.0) {
                  return false;
              }
              const std::complex<double> admittance =
                  polarization == LinearPolarization::kTe ? q : relative_permittivity / q;
              if (!finite_complex(admittance) || std::abs(admittance) <= 0.0) {
                  return false;
              }
              const std::complex<double> delta = k0_rad_per_m * thickness_m * q;
              const std::complex<double> cosine = std::cos(delta);
              const std::complex<double> sine = std::sin(delta);
              const std::complex<double> j(0.0, 1.0);
              const Matrix2 result{cosine, j * sine / admittance, j * admittance * sine, cosine};
              if (!finite_complex(result.a) || !finite_complex(result.b) || !finite_complex(result.c) ||
                  !finite_complex(result.d)) {
                  return false;
              }
              *matrix = result;
              return true;
          }

          bool reflection_for_polarization(const UrbanRfMaterialConfig& config,
                                           const std::complex<double>& glass_relative_permittivity,
                                           double frequency_hz, double incidence_angle_rad,
                                           LinearPolarization polarization, std::complex<double>* reflection) {
              const double cosine_incidence = std::cos(incidence_angle_rad);
              if (reflection == nullptr || !std::isfinite(cosine_incidence) || cosine_incidence <= kMinimumCosIncidence) {
                  return false;
              }
              const double sin_incidence = std::sin(incidence_angle_rad);
              const double sin_incidence_squared = sin_incidence * sin_incidence;
              const double k0_rad_per_m = 2.0 * kPi * frequency_hz / kSpeedOfLightMps;

              Matrix2 outer_glass{};
              Matrix2 cavity{};
              Matrix2 inner_glass{};
              if (!layer_matrix(glass_relative_permittivity, sin_incidence_squared, config.outer_glass_thickness_m,
                                k0_rad_per_m, polarization, &outer_glass) ||
                  !layer_matrix({1.0, 0.0}, sin_incidence_squared, config.cavity_thickness_m, k0_rad_per_m,
                                polarization, &cavity) ||
                  !layer_matrix(glass_relative_permittivity, sin_incidence_squared, config.inner_glass_thickness_m,
                                k0_rad_per_m, polarization, &inner_glass)) {
                  return false;
              }

              const Matrix2 sheet{{1.0, 0.0}, {0.0, 0.0},
                                  {kFreeSpaceImpedanceOhm / config.coating_sheet_resistance_ohm_sq, 0.0}, {1.0, 0.0}};
              const Matrix2 stack = multiply(multiply(multiply(outer_glass, sheet), cavity), inner_glass);
              const std::complex<double> q_air(cosine_incidence, 0.0);
              const std::complex<double> air_admittance =
                  polarization == LinearPolarization::kTe ? q_air : std::complex<double>(1.0, 0.0) / q_air;
              const std::complex<double> denominator = stack.a + stack.b * air_admittance;
              if (!finite_complex(denominator) || std::abs(denominator) <= 0.0) {
                  return false;
              }
              const std::complex<double> input_admittance =
                  (stack.c + stack.d * air_admittance) / denominator;
              const std::complex<double> reflection_denominator = air_admittance + input_admittance;
              if (!finite_complex(input_admittance) || !finite_complex(reflection_denominator) ||
                  std::abs(reflection_denominator) <= 0.0) {
                  return false;
              }
              const std::complex<double> result =
                  (air_admittance - input_admittance) / reflection_denominator;
              if (!finite_complex(result)) {
                  return false;
              }
              *reflection = result;
              return true;
          }

          const UrbanRfPolarizationResponseConfig& polarization_config(const UrbanRfAntennaConfig& config,
                                                                       UrbanCircularPolarization polarization) {
              return polarization == UrbanCircularPolarization::kRhcp ? config.rhcp : config.lhcp;
          }

          } // namespace

          bool validate_urban_rf_material_config(const UrbanRfMaterialConfig& config, std::string* error_message) {
              if (!finite_positive(config.relative_permittivity_real) ||
                  !finite_nonnegative(config.conductivity_c_s_per_m) ||
                  !finite_nonnegative(config.conductivity_exponent) || !finite_positive(config.outer_glass_thickness_m) ||
                  !finite_positive(config.cavity_thickness_m) || !finite_positive(config.inner_glass_thickness_m) ||
                  !finite_positive(config.coating_sheet_resistance_ohm_sq)) {
                  set_error(error_message, "urban RF material configuration is invalid");
                  return false;
              }
              return true;
          }

          bool validate_urban_rf_antenna_config(const UrbanRfAntennaConfig& config, std::string* error_message) {
              if (!validate_polarization_response(config.rhcp) || !validate_polarization_response(config.lhcp)) {
                  set_error(error_message, "urban RF antenna configuration is invalid");
                  return false;
              }
              return true;
          }

          bool resolve_urban_rf_signal_config(const UrbanRfConfig& config, const SignalDefinition& signal,
                                              UrbanRfResolvedConfig* resolved, std::string* error_message) {
              if (resolved == nullptr || signal.name == nullptr ||
                  !validate_urban_rf_material_config(config.default_material, error_message) ||
                  !validate_urban_rf_antenna_config(config.default_antenna, error_message)) {
                  if (resolved == nullptr) {
                      set_error(error_message, "urban RF resolved configuration output is null");
                  }
                  return false;
              }

              UrbanRfResolvedConfig result{config.default_material, config.default_antenna};
              for (const UrbanRfSignalOverrideConfig& override_config : config.signal_overrides) {
                  if (override_config.signal_name == signal.name) {
                      result.material = override_config.material;
                      result.antenna = override_config.antenna;
                      break;
                  }
              }
              if (!validate_urban_rf_material_config(result.material, error_message) ||
                  !validate_urban_rf_antenna_config(result.antenna, error_message)) {
                  return false;
              }
              *resolved = result;
              return true;
          }

          bool compute_low_e_curtain_wall_reflection(const UrbanRfMaterialConfig& config, double frequency_hz,
                                                     double incidence_angle_rad, UrbanRfReflectionResponse* response,
                                                     std::string* error_message) {
              if (response == nullptr || !validate_urban_rf_material_config(config, error_message) ||
                  !finite_positive(frequency_hz) || !std::isfinite(incidence_angle_rad) || incidence_angle_rad < 0.0 ||
                  incidence_angle_rad >= 0.5 * kPi) {
                  if (response == nullptr) {
                      set_error(error_message, "urban RF reflection output is null");
                  } else if (!finite_positive(frequency_hz)) {
                      set_error(error_message, "urban RF carrier frequency must be finite and positive");
                  } else if (!std::isfinite(incidence_angle_rad) || incidence_angle_rad < 0.0 ||
                             incidence_angle_rad >= 0.5 * kPi) {
                      set_error(error_message, "urban RF incidence angle must be within [0, pi/2)");
                  }
                  return false;
              }

              const double frequency_ghz = frequency_hz / 1.0e9;
              const double conductivity =
                  config.conductivity_c_s_per_m * std::pow(frequency_ghz, config.conductivity_exponent);
              if (!finite_nonnegative(conductivity)) {
                  set_error(error_message, "urban RF glass conductivity calculation failed");
                  return false;
              }
              const double omega = 2.0 * kPi * frequency_hz;
              const std::complex<double> relative_permittivity(
                  config.relative_permittivity_real, -conductivity / (omega * kVacuumPermittivityFpm));
              if (!finite_complex(relative_permittivity)) {
                  set_error(error_message, "urban RF complex glass permittivity calculation failed");
                  return false;
              }

              UrbanRfReflectionResponse result{};
              result.glass_conductivity_s_per_m = conductivity;
              result.glass_relative_permittivity = relative_permittivity;
              if (!reflection_for_polarization(config, relative_permittivity, frequency_hz, incidence_angle_rad,
                                               LinearPolarization::kTe, &result.gamma_te_tangent) ||
                  !reflection_for_polarization(config, relative_permittivity, frequency_hz, incidence_angle_rad,
                                               LinearPolarization::kTm, &result.gamma_tm_tangent)) {
                  set_error(error_message, "urban RF multilayer reflection calculation failed");
                  return false;
              }

              const std::complex<double> gamma_p_basis = -result.gamma_tm_tangent;
              result.gamma_rhcp_from_rhcp = 0.5 * (result.gamma_te_tangent + gamma_p_basis);
              result.gamma_lhcp_from_rhcp = 0.5 * (result.gamma_te_tangent - gamma_p_basis);
              if (!finite_complex(result.gamma_rhcp_from_rhcp) || !finite_complex(result.gamma_lhcp_from_rhcp)) {
                  set_error(error_message, "urban RF circular-polarization projection failed");
                  return false;
              }
              *response = result;
              return true;
          }

          bool evaluate_urban_antenna_response(const UrbanRfAntennaConfig& config, UrbanCircularPolarization polarization,
                                               double arrival_elevation_rad, std::complex<double>* voltage_response,
                                               std::string* error_message) {
              if (voltage_response == nullptr || !validate_urban_rf_antenna_config(config, error_message) ||
                  !std::isfinite(arrival_elevation_rad) || arrival_elevation_rad < 0.0 ||
                  arrival_elevation_rad > 0.5 * kPi) {
                  if (voltage_response == nullptr) {
                      set_error(error_message, "urban RF antenna response output is null");
                  } else if (!std::isfinite(arrival_elevation_rad) || arrival_elevation_rad < 0.0 ||
                             arrival_elevation_rad > 0.5 * kPi) {
                      set_error(error_message, "urban RF arrival elevation must be within [0, pi/2]");
                  }
                  return false;
              }

              const UrbanRfPolarizationResponseConfig& selected = polarization_config(config, polarization);
              const double fraction = arrival_elevation_rad / (0.5 * kPi);
              const double gain_db =
                  selected.gain_db_horizon + fraction * (selected.gain_db_zenith - selected.gain_db_horizon);
              const double phase_deg =
                  selected.phase_deg_horizon + fraction * (selected.phase_deg_zenith - selected.phase_deg_horizon);
              const double amplitude = std::pow(10.0, gain_db / 20.0);
              const std::complex<double> result = std::polar(amplitude, phase_deg * kDegreesToRadians);
              if (!finite_complex(result)) {
                  set_error(error_message, "urban RF antenna interpolation failed");
                  return false;
              }
              *voltage_response = result;
              return true;
          }

          bool compute_urban_reflected_port_factor(const UrbanRfReflectionResponse& reflection,
                                                   const UrbanRfAntennaConfig& antenna, double arrival_elevation_rad,
                                                   std::complex<double>* port_factor, std::string* error_message) {
              if (port_factor == nullptr || !finite_complex(reflection.gamma_rhcp_from_rhcp) ||
                  !finite_complex(reflection.gamma_lhcp_from_rhcp)) {
                  set_error(error_message, "urban RF reflected port-factor request is invalid");
                  return false;
              }
              std::complex<double> rhcp_response{};
              std::complex<double> lhcp_response{};
              if (!evaluate_urban_antenna_response(antenna, UrbanCircularPolarization::kRhcp, arrival_elevation_rad,
                                                   &rhcp_response, error_message) ||
                  !evaluate_urban_antenna_response(antenna, UrbanCircularPolarization::kLhcp, arrival_elevation_rad,
                                                   &lhcp_response, error_message)) {
                  return false;
              }
              const std::complex<double> result =
                  reflection.gamma_rhcp_from_rhcp * rhcp_response + reflection.gamma_lhcp_from_rhcp * lhcp_response;
              if (!finite_complex(result)) {
                  set_error(error_message, "urban RF reflected port-factor calculation failed");
                  return false;
              }
              *port_factor = result;
              return true;
          }

          } // namespace gnss_sim
          ''')

          Path('tests/unit/test_urban_rf_model.cpp').write_text(r'''#include "gnss/signal_definitions.h"
          #include "gnss_sim/sim_config.h"
          #include "model/urban_rf_model.h"

          #include <cstdio>
          #include <fstream>
          #include <gtest/gtest.h>
          #include <cmath>
          #include <complex>
          #include <string>

          namespace {

          constexpr double kPi = 3.141592653589793238462643383279502884;
          constexpr double kDegreesToRadians = kPi / 180.0;
          constexpr const char* kConfigPath = "gnss_sim_urban_rf_test.json";

          struct ConfigFileGuard {
              ~ConfigFileGuard() {
                  static_cast<void>(std::remove(kConfigPath));
              }
          };

          void write_config(const char* text) {
              std::ofstream output(kConfigPath, std::ios::binary | std::ios::trunc);
              output << text;
          }

          double complex_distance(const std::complex<double>& left, const std::complex<double>& right) {
              return std::abs(left - right);
          }

          TEST(UrbanRfModel, FrozenDefaultPresetMatchesIssue116) {
              const gnss_sim::SimConfig config = gnss_sim::default_sim_config();
              EXPECT_DOUBLE_EQ(config.urban_rf.default_material.relative_permittivity_real, 6.27);
              EXPECT_DOUBLE_EQ(config.urban_rf.default_material.conductivity_c_s_per_m, 0.0043);
              EXPECT_DOUBLE_EQ(config.urban_rf.default_material.conductivity_exponent, 1.1925);
              EXPECT_DOUBLE_EQ(config.urban_rf.default_material.outer_glass_thickness_m, 0.006);
              EXPECT_DOUBLE_EQ(config.urban_rf.default_material.cavity_thickness_m, 0.012);
              EXPECT_DOUBLE_EQ(config.urban_rf.default_material.inner_glass_thickness_m, 0.006);
              EXPECT_DOUBLE_EQ(config.urban_rf.default_material.coating_sheet_resistance_ohm_sq, 5.0);
              EXPECT_TRUE(config.urban_rf.signal_overrides.empty());
              EXPECT_DOUBLE_EQ(config.urban_rf.default_antenna.rhcp.gain_db_horizon, 0.0);
              EXPECT_DOUBLE_EQ(config.urban_rf.default_antenna.lhcp.gain_db_zenith, 0.0);
          }

          TEST(UrbanRfModel, NormalIncidenceHasEqualTangentialTeTmAndReversesHandedness) {
              const gnss_sim::UrbanRfMaterialConfig material = gnss_sim::default_sim_config().urban_rf.default_material;
              gnss_sim::UrbanRfReflectionResponse response{};
              std::string error_message;
              ASSERT_TRUE(gnss_sim::compute_low_e_curtain_wall_reflection(material, 1575.42e6, 0.0, &response,
                                                                          &error_message))
                  << error_message;
              EXPECT_LT(complex_distance(response.gamma_te_tangent, response.gamma_tm_tangent), 1.0e-12);
              EXPECT_LT(std::abs(response.gamma_rhcp_from_rhcp), 1.0e-12);
              EXPECT_GT(std::abs(response.gamma_lhcp_from_rhcp), 0.90);
              EXPECT_LT(std::abs(response.gamma_lhcp_from_rhcp), 1.0 + 1.0e-12);
              EXPECT_LT(response.glass_relative_permittivity.imag(), 0.0);
              EXPECT_GT(response.glass_conductivity_s_per_m, 0.0);
          }

          TEST(UrbanRfModel, FrequencyAngleThicknessAndSheetResistanceChangeComplexResponse) {
              const gnss_sim::UrbanRfMaterialConfig baseline = gnss_sim::default_sim_config().urban_rf.default_material;
              std::string error_message;
              gnss_sim::UrbanRfReflectionResponse l1_normal{};
              gnss_sim::UrbanRfReflectionResponse l5_normal{};
              gnss_sim::UrbanRfReflectionResponse l1_grazing{};
              ASSERT_TRUE(gnss_sim::compute_low_e_curtain_wall_reflection(baseline, 1575.42e6, 0.0, &l1_normal,
                                                                          &error_message));
              ASSERT_TRUE(gnss_sim::compute_low_e_curtain_wall_reflection(baseline, 1176.45e6, 0.0, &l5_normal,
                                                                          &error_message));
              ASSERT_TRUE(gnss_sim::compute_low_e_curtain_wall_reflection(
                  baseline, 1575.42e6, 85.0 * kDegreesToRadians, &l1_grazing, &error_message));
              EXPECT_GT(complex_distance(l1_normal.gamma_te_tangent, l5_normal.gamma_te_tangent), 1.0e-3);
              EXPECT_GT(std::abs(l1_grazing.gamma_te_tangent), std::abs(l1_normal.gamma_te_tangent));
              EXPECT_GT(std::fabs(std::arg(l1_normal.gamma_te_tangent)), 0.1);

              gnss_sim::UrbanRfMaterialConfig thicker = baseline;
              thicker.outer_glass_thickness_m = 0.008;
              gnss_sim::UrbanRfReflectionResponse thick_response{};
              ASSERT_TRUE(gnss_sim::compute_low_e_curtain_wall_reflection(thicker, 1575.42e6,
                                                                          30.0 * kDegreesToRadians, &thick_response,
                                                                          &error_message));
              gnss_sim::UrbanRfReflectionResponse baseline_oblique{};
              ASSERT_TRUE(gnss_sim::compute_low_e_curtain_wall_reflection(baseline, 1575.42e6,
                                                                          30.0 * kDegreesToRadians,
                                                                          &baseline_oblique, &error_message));
              EXPECT_GT(complex_distance(thick_response.gamma_te_tangent, baseline_oblique.gamma_te_tangent), 1.0e-4);

              gnss_sim::UrbanRfMaterialConfig different_sheet = baseline;
              different_sheet.coating_sheet_resistance_ohm_sq = 12.0;
              gnss_sim::UrbanRfReflectionResponse sheet_response{};
              ASSERT_TRUE(gnss_sim::compute_low_e_curtain_wall_reflection(different_sheet, 1575.42e6,
                                                                          30.0 * kDegreesToRadians, &sheet_response,
                                                                          &error_message));
              EXPECT_GT(complex_distance(sheet_response.gamma_te_tangent, baseline_oblique.gamma_te_tangent), 1.0e-3);
          }

          TEST(UrbanRfModel, AntennaInterpolatesComplexVoltageResponse) {
              gnss_sim::UrbanRfAntennaConfig antenna{};
              antenna.rhcp = {-20.0, 0.0, 0.0, 90.0};
              antenna.lhcp = {-30.0, -10.0, -90.0, 0.0};
              std::complex<double> response{};
              std::string error_message;
              ASSERT_TRUE(gnss_sim::evaluate_urban_antenna_response(antenna, gnss_sim::UrbanCircularPolarization::kRhcp,
                                                                    45.0 * kDegreesToRadians, &response,
                                                                    &error_message))
                  << error_message;
              EXPECT_NEAR(std::abs(response), std::pow(10.0, -10.0 / 20.0), 1.0e-12);
              EXPECT_NEAR(std::arg(response), 45.0 * kDegreesToRadians, 1.0e-12);
          }

          TEST(UrbanRfModel, JsonPerSignalOverrideStartsFromDefaultAndOnlyChangesNamedSignal) {
              ConfigFileGuard guard;
              write_config(R"json({
                  "urban_rf": {
                      "material": {"coating_sheet_resistance_ohm_sq": 6.0},
                      "antenna": {"rhcp": {"gain_db_zenith": 1.0}},
                      "signals": {
                          "GPS L1 C/A": {
                              "material": {"coating_sheet_resistance_ohm_sq": 9.0},
                              "antenna": {"rhcp": {"gain_db_zenith": 3.0}}
                          }
                      }
                  }
              })json");
              gnss_sim::SimConfig config{};
              std::string error_message;
              ASSERT_TRUE(gnss_sim::load_sim_config_json(kConfigPath, &config, &error_message)) << error_message;
              EXPECT_DOUBLE_EQ(config.urban_rf.default_material.coating_sheet_resistance_ohm_sq, 6.0);
              EXPECT_DOUBLE_EQ(config.urban_rf.default_antenna.rhcp.gain_db_zenith, 1.0);
              ASSERT_EQ(config.urban_rf.signal_overrides.size(), 1U);

